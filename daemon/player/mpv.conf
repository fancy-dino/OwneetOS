#
# OwneetOS's player: mpv as owneetd starts it for the Videos and Music pages
# ([[step-5.6-local-videos-and-music]], [[local-media]]), with this folder as mpv's configuration
# (--config-dir=/usr/share/owneet/player: nothing from ~/.config/mpv or /etc/mpv). owneetd adds
# the session's output (as for owneet-placeholder), the folder of saved positions, the control
# socket, the session file for owneet.lua, the profile for songs, and the files.
# The buttons are "Inside the player" in [[controller-input-map]] (input.conf); the display is
# owneet.lua's.

# ---- Only OwneetOS's buttons: none of mpv's own (its built-in input.conf, its scripts' keys).
# mpv reads the controller itself; Guide (GAMEPAD_MENU) is never bound, it stays owneetd's.
input-default-bindings=no
input-builtin-bindings=no
input-gamepad=yes
input-terminal=no
# no mouse needed (and none bound)
input-cursor=no
cursor-autohide=always

# ---- mpv's own on-screen controls are off: owneet.lua draws the display
osc=no
osd-bar=no
osd-on-seek=no
osd-level=1
osd-border-size=0
osd-shadow-offset=0
load-scripts=no
scripts=~~/owneet.lua
load-stats-overlay=no
load-console=no
load-commands=no
load-select=no
load-positioning=no
load-context-menu=no
load-auto-profiles=no
# nothing from the internet
ytdl=no

# ---- The whole screen; a window for songs too (their picture, or the console's art)
fullscreen=yes
force-window=yes
idle=no
# owneet.lua stops at a video's end when Autoplay is off (keep-open=always)
keep-open=no
msg-level=all=warn

# ---- Exact seeks: a relative seek otherwise goes to the nearest keyframe (sub-step 1: -5 s
# jumped 3 to 9 s)
hr-seek=yes

# ---- Saved positions: on the console's disk (owneetd gives --watch-later-dir), the position
# only (never a track choice such as "no sound"), the video's path on the first line (the
# console's "Continue watching" reads it); mpv uses a position up when the video opens and saves
# it again when it is left
save-position-on-quit=yes
resume-playback=yes
write-filename-in-watch-later-config=yes
watch-later-options=start
# each file starts with its own tracks, playing
reset-on-next-file=pause,aid,sid

# ---- Subtitles beside a video, by its name, show by themselves (mpv's own); embedded ones start off
sub-auto=exact
# ---- Songs: their own picture, or the folder's cover.jpg / folder.jpg
audio-display=embedded-first
cover-art-auto=exact

# ---- Hardware decoding where the driver allows it (checked on real hardware)
hwdec=auto-safe
# mpv's caches on the console's disk, never in this folder or beside the media
gpu-shader-cache-dir=~/.cache/owneet/player
icc-cache-dir=~/.cache/owneet/player

# ---- Songs: never resumed, never saved: a song starts from the beginning and the rest of its
# folder or album plays after it ([[local-media]]); owneetd adds --profile=owneet-music
[owneet-music]
profile-desc=OwneetOS: songs
resume-playback=no
save-position-on-quit=no
