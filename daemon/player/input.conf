#
# OwneetOS's player: "Inside the player" in [[controller-input-map]] (step 5.6). mpv reads the
# controller itself; these are the only bindings (mpv's own are off, mpv.conf). Every button
# goes to owneet.lua, which shows the display at each press, repeats held directions and
# triggers with the map's timing, and ignores the buttons while the console is on screen.
# Never bound: Guide (GAMEPAD_MENU in mpv: owneetd's), View (GAMEPAD_BACK, reserved), LB / RB
# (GAMEPAD_*_SHOULDER: only for switching sections), the sticks (a held stick sends bursts of
# presses); on the keyboard Q / E and the Super key. A test checks this file
# (daemon/internal/player/bindings_test.go).

# ---- The controller (SDL's names, as mpv 0.41 gives them)
GAMEPAD_ACTION_DOWN   script-binding owneet/play-pause
GAMEPAD_DPAD_LEFT     script-binding owneet/back-10
GAMEPAD_DPAD_RIGHT    script-binding owneet/forward-10
GAMEPAD_LEFT_TRIGGER  script-binding owneet/previous
GAMEPAD_RIGHT_TRIGGER script-binding owneet/next
GAMEPAD_ACTION_LEFT   script-binding owneet/audio
GAMEPAD_ACTION_UP     script-binding owneet/subtitles
GAMEPAD_START         script-binding owneet/autoplay
GAMEPAD_ACTION_RIGHT  script-binding owneet/leave
GAMEPAD_DPAD_UP       script-binding owneet/show
GAMEPAD_DPAD_DOWN     script-binding owneet/show
GAMEPAD_LEFT_STICK    script-binding owneet/show
GAMEPAD_RIGHT_STICK   script-binding owneet/show

# ---- The keyboard fallback: the same meanings (arrows = D-pad, Enter / Space = A, Esc /
# Backspace = B, X, Y, Z / C = LT / RT, M = Menu)
ENTER    script-binding owneet/play-pause
KP_ENTER script-binding owneet/play-pause
SPACE    script-binding owneet/play-pause
LEFT     script-binding owneet/back-10
RIGHT    script-binding owneet/forward-10
z        script-binding owneet/previous
Z        script-binding owneet/previous
c        script-binding owneet/next
C        script-binding owneet/next
x        script-binding owneet/audio
X        script-binding owneet/audio
y        script-binding owneet/subtitles
Y        script-binding owneet/subtitles
m        script-binding owneet/autoplay
M        script-binding owneet/autoplay
ESC      script-binding owneet/leave
BS       script-binding owneet/leave
UP       script-binding owneet/show
DOWN     script-binding owneet/show
