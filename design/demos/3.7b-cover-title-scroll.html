<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- OwneetOS - interactive demo: covers' titles (open item 3ad). A cover's title stays on one line: when it does not
     fit it ends with "…", and while the cover is highlighted it scrolls (the rule of demo 3.3b: 1.5 s, 45 px/s,
     1.5 s, back to the start). The badge ("Local") never sits over the title any more. "Before" shows today's
     covers (title on up to three lines) to compare. Open in a browser; drive it with a gamepad or the keyboard.
     Fonts are loaded from Google Fonts for the demo only: the console bundles the font files (SIL Open Font
     License). -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwneetOS - Covers' titles (demo 3.7b)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Lexend:wght@300..600&display=swap">
<style>
:root { --display: "Bricolage Grotesque", system-ui, sans-serif; --text: "Lexend", system-ui, sans-serif; --ts: 1; --motion: 1;
  --bg: #0E1424; --surface: #172036; --raised: #222D4A; --line: #2E3A5C; --fg: #EEF1F8; --muted: #8F9AB5; --accent: #FF8A5B; --on-accent: #1E0E06; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05070C; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; font-family: var(--text); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }
.frame { position: relative; flex: none; }
.stage {
  width: 1280px; height: 720px; position: absolute; top: 0; left: 0; overflow: hidden; transform-origin: top left;
  background: var(--bg); color: var(--fg); padding: 36px 64px 28px;
  display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 18px;
  font-size: calc(16px * var(--ts)); line-height: 1.35; font-weight: 350;
}
.t-xs { font-size: calc(12.5px * var(--ts)); } .t-s { font-size: calc(14.5px * var(--ts)); }
.t-m { font-size: calc(17px * var(--ts)); } .t-xl { font-size: calc(40px * var(--ts)); }
.disp { font-family: var(--display); font-variation-settings: "wdth" 82; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.muted { color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; }
.top-left { display: flex; align-items: center; gap: 36px; }
.mark { font-family: var(--display); font-weight: 800; font-variation-settings: "wdth" 78; font-size: 23px; letter-spacing: -0.03em; }
.mark i { font-style: normal; color: var(--accent); }
.tabs { display: flex; gap: 6px; align-items: center; }
.tab { padding: 7px 18px; border-radius: 999px; color: var(--muted); }
.tab[aria-current="page"] { background: var(--fg); color: var(--bg); font-weight: 500; }
.status .clock { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.head { display: flex; align-items: baseline; gap: 14px; }
.head h1 { margin: 0; }
.filters { display: flex; gap: 8px; }
.chip { padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }

.grid { display: grid; grid-template-columns: repeat(7, 152px); gap: 14px; align-content: start; }
.cover { position: relative; height: 190px; border-radius: 14px; overflow: hidden; color: #fff; }
.cover .art { position: absolute; inset: 0; }
.cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%); }
.cover .badge { position: absolute; left: 8px; top: 8px; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.45); }
.cover .body { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; gap: 6px; }
.cover .title { font-size: calc(17px * var(--ts)); line-height: .95; }
.cover .sub { opacity: .85; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
.cover .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.cover .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: #fff; }
.cover .bar.moving i { width: 35%; animation: mv 1.4s linear infinite; }
@keyframes mv { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.cover.focus { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6.5px var(--accent), 0 12px 28px -10px rgba(0,0,0,.55); transform: scale(1.02); z-index: 2; overflow: visible; }
.cover.focus .art, .cover.focus .shade { border-radius: 14px; }
/* before: the title on up to three lines, "…" at the end of the third */
.before .cover .title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- The rule (3.3b): one line, "…" when it does not fit; highlighted, it scrolls ---------- */
.clip { display: block; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-block: .08em; }
.clip > span { display: inline; }
.clip.scrolling > span { display: inline-block; }
.clip.scrolling { text-overflow: clip;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
.clip.scrolling.at-start { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent 100%); mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent 100%); }
.clip.scrolling.at-end { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px); mask-image: linear-gradient(90deg, transparent 0, #000 14px); }

.prompts { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.prompts .set { display: flex; gap: 24px; }
.prompt { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.g { height: calc(26px * var(--ts)); width: auto; color: var(--fg); flex: none; vertical-align: middle; }

.demo-bar { display: flex; gap: 22px; align-items: center; color: #8a90a0; font: 12px/1.4 system-ui, sans-serif; flex-wrap: wrap; justify-content: center; }
.demo-bar .grp { display: inline-flex; gap: 6px; align-items: center; }
.demo-bar button { padding: 3px 10px; border-radius: 999px; border: 1px solid #333a4a; color: #c9cdd8; font: inherit; }
.demo-bar button[aria-pressed="true"] { background: #c9cdd8; color: #05070C; }
.help { margin: 0; color: #8a90a0; font: 12px/1.45 system-ui, sans-serif; text-align: center; padding-inline: 12px; }
.help b { color: #c9cdd8; font-weight: 600; }
</style>
</head>
<body>

<div class="frame" id="frame"><div class="stage" id="stage">
  <header class="top">
    <div class="top-left">
      <span class="mark">Owneet<i>OS</i></span>
      <nav class="tabs t-s"><span class="tab" data-t="tab.home"></span><span class="tab" aria-current="page" data-t="tab.library"></span><span class="tab" data-t="tab.settings"></span></nav>
    </div>
    <div class="status t-s"><span class="clock" id="clock">12:11</span></div>
  </header>
  <div class="head"><h1 class="disp t-xl" data-t="tab.library"></h1><span class="muted t-m" id="count"></span></div>
  <div class="filters t-s"><span class="chip" data-t="f.all"></span><span class="chip" data-t="f.installed"></span><span class="chip" aria-current="true" data-t="f.local"></span></div>
  <main class="grid" id="grid"></main>
  <footer class="prompts t-s"><div class="set" id="pl"></div><div class="set" id="pr"></div></footer>
</div></div>

<div class="demo-bar" id="demo-bar">
  <span class="grp"><span>Covers:</span><button data-mode="after" aria-pressed="true">New (one line, scrolls)</button><button data-mode="before">Before (up to 3 lines)</button></span>
  <span class="grp"><span>Text size:</span><button data-ts="1">M</button><button data-ts="1.2">L</button><button data-ts="1.4" aria-pressed="true">XL</button></span>
  <span class="grp"><span>Language:</span><button data-lang="it" aria-pressed="true">Italiano</button><button data-lang="en">English</button></span>
</div>
<p class="help"><b>Gamepad:</b> D-pad / stick move between the covers. <b>Keyboard:</b> arrows. The other buttons do nothing in this demo.</p>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const stage = $('#stage');

  const EN = { 'tab.home': 'Home', 'tab.library': 'Library', 'tab.settings': 'Settings', 'f.all': 'All', 'f.installed': 'Installed',
    'f.local': 'Local', 'local': 'Local', 'games': '{n} games', 'not': 'Not installed', 'installing': 'Installing · {p}%', 'inst': 'Installing',
    'waiting': 'Waiting', 'p.play': 'Play', 'p.details': 'Details', 'p.options': 'Options', 'p.sections': 'Sections', 'p.home': 'Home' };
  const IT = { 'tab.home': 'Home', 'tab.library': 'Libreria', 'tab.settings': 'Impostazioni', 'f.all': 'Tutti', 'f.installed': 'Installati',
    'f.local': 'Locali', 'local': 'Locale', 'games': '{n} giochi', 'not': 'Non installato', 'installing': 'Installazione · {p}%', 'inst': 'Installazione',
    'waiting': 'In attesa', 'p.play': 'Gioca', 'p.details': 'Dettagli', 'p.options': 'Opzioni', 'p.sections': 'Sezioni', 'p.home': 'Home' };
  let lang = 'it', mode = 'after';
  const tr = (k, a = {}) => ((lang === 'it' ? IT : EN)[k] || k).replace(/\{(\w+)\}/g, (_, x) => a[x]);

  const GAMES = [
    { t: 'The Witcher 2: Assassin of kings', disk: '2TB HDD SATA', state: 'installing', p: 99, c: ['#d0436f', '#3a1022'] },
    { t: 'The Witcher 2: Win', disk: '2TB HDD SATA', state: 'waiting', c: ['#4caf50', '#0f2a14'] },
    { t: 'Lantern Keep', disk: '2TB HDD SATA', c: ['#e0c040', '#3a3010'] },
    { t: 'Quiet Orbit: The Long Way Home', disk: '2TB HDD SATA', c: ['#9b59d0', '#24123a'] },
    { t: 'Moss Garden', disk: '', c: ['#40c060', '#10301a'] },
    { t: 'Shadow Harbor: The Complete Edition', disk: '2TB HDD SATA', state: 'not', c: ['#7a4fd0', '#1c1238'] },
    { t: 'Nebula Drift', disk: '2TB HDD SATA', c: ['#e04a5a', '#3a1016'] },
  ];

  const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const circle = inner => `<svg class="g" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.8"/>${inner}</svg>`;
  const letter = l => circle(`<text x="13" y="17.6" text-anchor="middle" font-family="Lexend, sans-serif" font-weight="600" font-size="13" fill="currentColor">${l}</text>`);
  const pill = (t, w) => `<svg class="g" viewBox="0 0 ${w} 26"><rect x="1" y="1" width="${w - 2}" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="${w / 2}" y="17.4" text-anchor="middle" font-family="Lexend, sans-serif" font-weight="600" font-size="11.5" fill="currentColor">${t}</text></svg>`;
  const G = { a: letter('A'), x: letter('X'), menu: circle(`<path d="M8.5 9.5h9M8.5 13h9M8.5 16.5h9" ${S}/>`), lb: pill('LB', 34), rb: pill('RB', 34),
              guide: circle(`<path d="M8 13.2 13 8.8l5 4.4M9.6 12v5.4h6.8V12" ${S}/>`) };
  const P = (b, l) => `<span class="prompt">${b.map(x => G[x]).join('')}<span>${tr(l)}</span></span>`;

  let focusIndex = 0, focused = null;
  function cover(g, i) {
    const st = g.state === 'installing' ? tr('installing', { p: g.p }) : g.state === 'waiting' ? tr('waiting') : g.state === 'not' ? tr('not') : '';
    const bar = g.state === 'installing' ? `<div class="bar"><i style="width:${g.p}%"></i></div>` : g.state === 'waiting' ? '<div class="bar"></div>' : '';
    const title = mode === 'after' ? `<span class="clip disp title"><span>${g.t}</span></span>` : `<span class="disp title">${g.t}</span>`;
    return `<div class="cover" data-i="${i}">
      <div class="art" style="background: radial-gradient(120% 90% at 70% 10%, ${g.c[0]}, ${g.c[1]} 80%)"></div><div class="shade"></div>
      <span class="badge t-xs">${tr('local')}</span>
      <div class="body">${title}${g.disk ? `<span class="sub t-xs">${g.disk}</span>` : ''}${st ? `<span class="t-xs">${st}</span>` : ''}${bar}</div>
    </div>`;
  }
  function draw() {
    document.documentElement.lang = lang;
    $$('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
    $('#count').textContent = tr('games', { n: GAMES.length });
    $('#grid').className = 'grid ' + mode;
    $('#grid').innerHTML = GAMES.map(cover).join('');
    $('#pl').innerHTML = P(['a'], 'p.play') + P(['x'], 'p.details') + P(['menu'], 'p.options');
    $('#pr').innerHTML = P(['lb', 'rb'], 'p.sections') + P(['guide'], 'p.home');
    focus(focusIndex);
  }

  /* ---------- Scrolling (3.3b): wait, move at a steady speed, wait at the end, come back, repeat ---------- */
  const speed = 45, pause = 1500; let run = null;
  function stopScroll() {
    if (!run) return;
    cancelAnimationFrame(run.raf);
    run.clip.classList.remove('scrolling', 'at-start', 'at-end');
    run.inner.style.transform = ''; run.inner.style.opacity = ''; run = null;
  }
  function startScroll(el) {
    stopScroll();
    const c = el.querySelector('.clip'); if (!c) return;
    const inner = c.firstElementChild, over = c.scrollWidth - c.clientWidth;
    if (over <= 1) return;
    const dist = over + 14, travel = dist / speed * 1000;
    run = { clip: c, inner, raf: 0, t0: performance.now() };
    c.classList.add('scrolling', 'at-start');
    const tick = now => {
      if (!run) return;
      const t = (now - run.t0) % (pause + travel + pause + 400), end = pause + travel + pause;
      let x, shown = true;
      if (t < pause) x = 0;
      else if (t < pause + travel) x = (t - pause) / travel * dist;
      else if (t < end) x = dist;
      else { x = t < end + 200 ? dist : 0; shown = false; }
      c.classList.toggle('at-start', x === 0);
      c.classList.toggle('at-end', x === dist);
      inner.style.opacity = shown ? 1 : 0;
      inner.style.transform = `translateX(${-x}px)`;
      run.raf = requestAnimationFrame(tick);
    };
    inner.style.transition = 'opacity .2s';
    run.raf = requestAnimationFrame(tick);
  }
  function focus(i) {
    focusIndex = Math.max(0, Math.min(GAMES.length - 1, i));
    if (focused) focused.classList.remove('focus');
    focused = $(`.cover[data-i="${focusIndex}"]`); focused.classList.add('focus');
    startScroll(focused);
  }
  function move(dir) { if (dir === 'left') focus(focusIndex - 1); else if (dir === 'right') focus(focusIndex + 1); }

  document.addEventListener('keydown', e => {
    const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (dirs[e.key]) { e.preventDefault(); move(dirs[e.key]); }
  });
  let repeatAt = 0, lastDir = null;
  function poll(ts) {
    const pad = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean)[0] : null;
    if (pad) {
      const on = i => !!(pad.buttons[i] && pad.buttons[i].pressed);
      const ax = pad.axes[0] || 0;
      const dir = on(14) || ax < -0.5 ? 'left' : on(15) || ax > 0.5 ? 'right' : null;
      if (dir && ts > repeatAt) { move(dir); repeatAt = ts + (lastDir === dir ? 140 : 360); }
      lastDir = dir; if (!dir) repeatAt = 0;
    }
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);

  $('#demo-bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', b.closest('.grp')).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if (b.dataset.mode) mode = b.dataset.mode;
    if (b.dataset.ts) document.documentElement.style.setProperty('--ts', b.dataset.ts);
    if (b.dataset.lang) lang = b.dataset.lang;
    draw(); b.blur();
  });

  function fit() {
    const s = Math.min(innerWidth / 1280, (innerHeight - 70) / 720);
    stage.style.transform = `scale(${s})`;
    $('#frame').style.width = 1280 * s + 'px'; $('#frame').style.height = 720 * s + 'px';
  }
  addEventListener('resize', fit); fit();
  const clock = () => { $('#clock').textContent = new Date().toTimeString().slice(0, 5); };
  clock(); setInterval(clock, 10000);

  /* ---------- Optional start state: #lang=en&ts=1&mode=before&at=0 ---------- */
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('lang') === 'en') lang = 'en';
  if (q.get('mode') === 'before') mode = 'before';
  document.documentElement.style.setProperty('--ts', q.get('ts') || '1.4');
  if (q.get('at')) focusIndex = +q.get('at');
  draw();
})();
</script>
</body>
</html>
