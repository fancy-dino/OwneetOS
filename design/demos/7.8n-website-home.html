<!-- OwneetOS: interactive demo for [[step-7.8n-website-simpler-home]], the website's simpler home
     (owner, 2026-11-04). Five sections: Home (a carousel, a sentence beside a screen of the console,
     and the link to the credits), Plug it. (the guide and the questions), Play it. (a short tour of
     the buttons), Own it! (it belongs to everyone), Download (reached by scrolling to the end or
     with "Get OwneetOS"). The header has the three middle sections; the name leads to Home.
     English and Italian (the real site takes its texts from translation files, in every language).
     The start-up animation is left out. The screens are real ones from the preview
     (tools/preview-steps/site-home.txt, site-home-game.txt), in English and in Dusk for now, with
     invented games; they are taken again after step 5.7. Icons: Lucide 1.52.0 (ISC License; some
     derived from Feather, MIT License; CREDITS.md). Fonts come from Google Fonts for the demo only:
     the real site serves its own. Open in a browser; mouse, keyboard and touch. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwneetOS: new home (demo 7.8n)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Lexend:wght@400;500&display=swap">
<style>
:root { --bg: #0e1424; --surface: #172036; --raised: #222d4a; --line: #2e3a5c; --fg: #eef1f8;
  --muted: #8f9ab5; --accent: #ff8a5b; --on-accent: #1e0e06;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --text: "Lexend", system-ui, sans-serif;
  --wrap: 1160px; --head: 68px; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef0f5; --surface: #fff; --raised: #e2e6ef; --line: #c9cfdc; --fg: #121826;
  --muted: #5a6378; --accent: #2f5bea; --on-accent: #fff; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef0f5; --surface: #fff; --raised: #e2e6ef; --line: #c9cfdc; --fg: #121826;
  --muted: #5a6378; --accent: #2f5bea; --on-accent: #fff; color-scheme: light; }
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--text); font-weight: 400; line-height: 1.5; overflow-x: clip; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; width: 100%; }
.disp { font-family: var(--display); font-variation-settings: "wdth" 80; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.ic { display: inline-flex; width: 18px; height: 18px; }
.ic svg { width: 100%; height: 100%; display: block; }
/* the outlines reach the viewBox's edges: never clip them on a fractional pixel */
.wordmark { display: block; height: 30px; width: auto; fill: var(--fg); overflow: visible; }
.wordmark .accent { fill: var(--accent); }

.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1px solid transparent; cursor: pointer;
  border-radius: 999px; padding: 12px 24px; font-size: 16px; font-weight: 500; transition: transform .15s ease; background: none; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.small { padding: 8px 16px; font-size: 14px; }

/* Header */
header.site { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: var(--head);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); }
.nav { display: flex; align-items: center; gap: 28px; height: 100%; }
.logo { display: flex; align-items: center; }
.nav ul { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
.nav ul a { display: block; text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 999px; font-size: 15px; }
.nav ul a:hover, .nav ul a[aria-current="true"] { color: var(--fg); }
.nav ul a[aria-current="true"] { background: var(--surface); }
.end { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.hdr-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: none; font-size: 14px; cursor: pointer; }
.hdr-btn:hover { background: var(--surface); }
.hdr-btn .chev { width: 14px; height: 14px; color: var(--muted); }
.langmenu { position: relative; }
.nav ul.lang-list { display: block; position: absolute; right: 0; top: calc(100% + 8px); min-width: 190px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgb(0 0 0 / .25); z-index: 30; }
.nav ul.lang-list[hidden] { display: none; }
.nav ul.lang-list a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--fg); }
.nav ul.lang-list a:hover, .nav ul.lang-list a[aria-current="true"] { background: var(--raised); }
.lang-list .ic { width: 16px; height: 16px; color: var(--accent); }
.theme-btn { width: 36px; padding: 0; justify-content: center; }
.menu-btn { display: none; align-items: center; gap: 6px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }

/* Sections: one screen each, snapped */
.snap { min-height: 100svh; scroll-snap-align: start; padding: calc(var(--head) + 32px) 0 48px; display: flex; align-items: center; }
.snap > .wrap { display: grid; gap: 36px; }
.snap > .wrap > * { min-width: 0; }
.head { text-align: center; display: grid; gap: 12px; justify-items: center; }
.head h2 { font-size: clamp(38px, 6vw, 72px); margin: 0; }
.head p { color: var(--muted); font-size: 18px; margin: 0; max-width: 30em; }
.icon { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.icon .ic { width: 30px; height: 30px; }

/* Where we are: one dot per section, on the right */
.side { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 15; display: grid; gap: 12px; }
.side a { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; transition: transform .2s ease, background .2s ease; }
.side a[aria-current="true"] { background: var(--accent); transform: scale(1.35); }

/* Pictures of the console */
.shot { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; border: 1px solid var(--line); background: #0e1424; }

/* Home: the carousel. The strip spans the whole screen, one slide on it at rest */
#home > .wrap { gap: 24px; }
.carousel { margin: 0 calc(50% - 50vw); --card: min(1112px, 88vw); }
.track { position: relative; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none;
  padding: 8px calc(50vw - var(--card) / 2) 28px; gap: calc(50vw - var(--card) / 2); }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 var(--card); scroll-snap-align: center; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); gap: 56px; align-items: center; }
.slide .say { margin: 0; font-size: clamp(32px, 4.3vw, 56px); }
.slide .shot { justify-self: end; max-width: calc((100svh - 310px) * 16 / 9); }
.controls { display: flex; justify-content: center; align-items: center; gap: 18px; }
.arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.pips { display: flex; gap: 8px; }
.pips button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.pips button[aria-current="true"] { background: var(--accent); width: 24px; border-radius: 999px; }
.made { text-align: center; margin: 0; font-size: 15px; color: var(--muted); }
.made a:hover { color: var(--fg); }

/* Plug it. */
.infos { display: grid; grid-template-columns: repeat(2, minmax(0, 340px)); gap: 20px; justify-content: center; }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px 24px; text-decoration: none;
  display: grid; justify-items: center; text-align: center; gap: 10px; transition: transform .15s ease, border-color .15s ease; }
.info:hover { transform: translateY(-2px); border-color: var(--accent); }
.info b { font-family: var(--display); font-variation-settings: "wdth" 80; font-weight: 800; font-size: 24px; }
.info span:last-child { color: var(--muted); font-size: 15.5px; }

/* Play it.: the buttons on the left, the console's screen following them; the selected one wears
   the console's own selection ring */
.tour { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); gap: 40px; align-items: center; }
.moves { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.move { width: 100%; display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; text-align: left; cursor: pointer;
  background: none; border: 0; border-radius: 16px; padding: 12px 14px; color: var(--muted); font-size: 15.5px; line-height: 1.35;
  outline: 3px solid transparent; outline-offset: 2px; transition: background .2s ease, color .2s ease, outline-color .2s ease; }
.move:hover { color: var(--fg); }
.move[aria-current="true"] { background: var(--surface); color: var(--fg); outline-color: var(--accent); }
.glyphs { display: flex; gap: 5px; justify-content: center; color: var(--fg); }
.glyph { min-width: 34px; height: 34px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 15px; font-weight: 500; }
.glyph.pill { min-width: 34px; height: 26px; border-radius: 7px; font-size: 11.5px; font-weight: 600; padding: 0 4px; }
.glyph .ic { width: 18px; height: 18px; }
.screens { position: relative; aspect-ratio: 16 / 9; justify-self: end; width: 100%; max-width: calc((100svh - 300px) * 16 / 9); }
.screens .shot { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
.screens .shot.on { opacity: 1; }

/* Own it! */
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.fact { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 12px; }
.fact b { font-weight: 500; font-size: 17px; }

/* Download, and the footer */
.last { flex-direction: column; justify-content: space-between; padding-bottom: 0; }
.box { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface));
  border: 1px solid var(--line); border-radius: 28px; padding: 64px 24px; text-align: center; display: grid; gap: 28px; justify-items: center; margin: auto 0; }
.box h2 { font-size: clamp(36px, 5vw, 60px); margin: 0; }
footer { width: 100%; border-top: 1px solid var(--line); padding: 22px 0 26px; font-size: 13.5px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
footer .wordmark { height: 22px; }
footer a { text-decoration: none; }
footer a:hover { color: var(--fg); text-decoration: underline; }
.marks { flex-basis: 100%; font-size: 12.5px; }

.notice { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 160%); visibility: hidden; opacity: 0; z-index: 40;
  background: var(--raised); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px;
  font-size: 14px; max-width: calc(100% - 32px); transition: transform .25s ease, opacity .25s ease, visibility .25s; }
.notice.on { transform: translate(-50%, 0); visibility: visible; opacity: 1; }

/* Below this the links no longer fit: the Menu button opens them under the header */
@media (max-width: 820px) {
  .menu-btn { display: inline-flex; }
  .nav ul#menu { display: none; position: absolute; top: var(--head); left: 0; right: 0; flex-direction: column; gap: 0;
    background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px 16px; }
  .nav ul#menu.open { display: flex; }
  .nav ul#menu a { padding: 12px; }
  .get { display: none; }
}
@media (max-width: 960px) {
  .side { display: none; }
  .slide { grid-template-columns: minmax(0, 1fr); gap: 24px; text-align: center; }
  .slide .shot { justify-self: center; }
  .tour { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .screens { order: -1; justify-self: center; max-width: 640px; }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .infos { grid-template-columns: minmax(0, 420px); }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .hdr-btn .code { display: none; }
  .snap { padding-top: calc(var(--head) + 20px); }
  .nav { gap: 12px; }
  .move { grid-template-columns: 70px 1fr; padding: 8px 10px; font-size: 14.5px; }
}
@media (prefers-reduced-motion: reduce) {
  html, .track { scroll-behavior: auto; }
  .btn, .info, .side a, .move, .screens .shot, .notice { transition: none; }
}
</style>
</head>
<body>
<header class="site">
  <nav class="wrap nav" aria-label="Main">
    <a class="logo" href="#home" aria-label="OwneetOS" id="logo"></a>
    <ul id="menu"></ul>
    <div class="end">
      <div class="langmenu">
        <button class="hdr-btn" type="button" id="langBtn" aria-haspopup="true" aria-expanded="false"></button>
        <ul class="lang-list" id="langList" hidden></ul>
      </div>
      <button class="hdr-btn theme-btn" type="button" id="themeBtn"></button>
      <a class="btn primary small get" href="#download" id="get"></a>
      <button class="menu-btn" type="button" id="menuBtn" aria-controls="menu" aria-expanded="false"></button>
    </div>
  </nav>
</header>

<nav class="side" id="side"></nav>

<main>
  <section class="snap" id="home">
    <div class="wrap">
      <div class="carousel" id="carousel">
        <div class="track" id="track" tabindex="0" role="region" aria-roledescription="carousel"></div>
        <div class="controls">
          <button class="arrow" type="button" id="prev"></button>
          <div class="pips" id="pips"></div>
          <button class="arrow" type="button" id="next"></button>
        </div>
      </div>
      <p class="made"><a href="#" id="made" data-page="credits"></a></p>
    </div>
  </section>

  <section class="snap" id="plug">
    <div class="wrap">
      <div class="head"><h2 class="disp" id="plugTitle"></h2><p id="plugLede"></p></div>
      <div class="infos" id="infos"></div>
    </div>
  </section>

  <section class="snap" id="play">
    <div class="wrap">
      <div class="head"><h2 class="disp" id="playTitle"></h2><p id="playLede"></p></div>
      <div class="tour" id="tour">
        <ul class="moves" id="moves"></ul>
        <div class="screens" id="screens"></div>
      </div>
    </div>
  </section>

  <section class="snap" id="own">
    <div class="wrap">
      <div class="head"><h2 class="disp" id="ownTitle"></h2><p id="ownLede"></p></div>
      <div class="facts" id="facts"></div>
    </div>
  </section>

  <section class="snap last" id="download">
    <div class="wrap">
      <div class="box">
        <h2 class="disp" id="dlTitle"></h2>
        <a class="btn primary" href="#download" id="dlBtn"></a>
      </div>
    </div>
    <footer><div class="wrap" id="foot"></div></footer>
  </section>
</main>
<div class="notice" id="notice" role="status"></div>

const $ = (s) => document.querySelector(s);
function ic(name, cls = "") {
  const nodes = (ICONS[name] || []).map(([tag, a]) => `<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("");
  return `<span class="ic ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${nodes}</svg></span>`;
}
const params = new URLSearchParams(location.search);
const state = { lang: T[params.get("lang")] ? params.get("lang") : "en", section: "home", slide: 0, move: 0 };
const tr = () => T[state.lang];

// ---- Notices
let noticeTimer;
function notice(text) {
  const n = $("#notice");
  n.textContent = text;
  n.classList.add("on");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => n.classList.remove("on"), 3200);
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-page]");
  if (a) {
    e.preventDefault();
    notice(tr().opens.replace("{page}", a.dataset.page));
  }
});

// ---- The carousel: as on the site, it plays by itself every 5 s and loops, and stops only while
// pointed at (or focused from the keyboard) and off screen
const track = $("#track");
const carousel = $("#carousel");
let paused = false, onScreen = false, slideTimer;
const n = SLIDES.length;
function slideHtml(i, copy) {
  const say = tr().slides[i];
  const text = i === 0 && !copy ? `<h1 class="disp say">${say}</h1>` : `<p class="disp say">${say}</p>`;
  return `<div class="slide"${copy ? ' aria-hidden="true"' : ` role="group" aria-roledescription="slide"`}>${text}<img class="shot" src="${PICS}${SLIDES[i]}.webp" alt="" loading="${i < 2 ? "eager" : "lazy"}"></div>`;
}
function place(pos) {
  const card = track.children[pos];
  return card.offsetLeft - (track.clientWidth - card.clientWidth) / 2;
}
function jump(pos) {
  track.style.scrollBehavior = "auto";
  track.style.scrollSnapType = "none";
  track.scrollLeft = place(pos);
  void track.offsetWidth;
  track.style.scrollBehavior = "";
  track.style.scrollSnapType = "";
}
function setSlide(i) {
  state.slide = i;
  $("#pips").querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-current", j === i));
}
function go(i, again = true) {
  setSlide((i + n) % n);
  track.scrollTo({ left: place(i + 1) });
  if (i < 0 || i >= n) setTimeout(settle, 900);
  if (again) restart();
}
function settle() {
  const middle = track.scrollLeft + track.clientWidth / 2;
  let best = 0, distance = Infinity;
  [...track.children].forEach((card, pos) => {
    const d = Math.abs(card.offsetLeft + card.clientWidth / 2 - middle);
    if (d < distance) { distance = d; best = pos; }
  });
  if (distance > 4) return;
  if (best === 0) { setSlide(n - 1); jump(n); }
  else if (best === n + 1) { setSlide(0); jump(1); }
  else setSlide(best - 1);
}
function restart() {
  clearInterval(slideTimer);
  if (!paused && onScreen && !document.hidden) slideTimer = setInterval(() => go(state.slide + 1, false), AUTOPLAY);
}
let settleTimer;
track.addEventListener("scroll", () => { clearTimeout(settleTimer); settleTimer = setTimeout(settle, 120); });
track.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); go(state.slide - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); go(state.slide + 1); }
});
$("#prev").onclick = () => go(state.slide - 1);
$("#next").onclick = () => go(state.slide + 1);
carousel.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { paused = true; restart(); } });
carousel.addEventListener("pointerleave", () => { paused = false; restart(); });
carousel.addEventListener("focusin", (e) => { if (e.target.matches(":focus-visible")) { paused = true; restart(); } });
carousel.addEventListener("focusout", (e) => { if (!carousel.contains(e.relatedTarget)) { paused = false; restart(); } });

// ---- Play it.: the buttons take turns by themselves, by the same rules; a click chooses one
const tour = $("#tour");
let tourPaused = false, tourOn = false, tourTimer;
function setMove(i) {
  state.move = i;
  $("#moves").querySelectorAll(".move").forEach((b, j) => b.setAttribute("aria-current", j === i));
  $("#screens").querySelectorAll(".shot").forEach((s, j) => s.classList.toggle("on", j === i));
}
function tourRestart() {
  clearInterval(tourTimer);
  if (!tourPaused && tourOn && !document.hidden) tourTimer = setInterval(() => setMove((state.move + 1) % MOVES.length), AUTOPLAY);
}
tour.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { tourPaused = true; tourRestart(); } });
tour.addEventListener("pointerleave", () => { tourPaused = false; tourRestart(); });
tour.addEventListener("focusin", (e) => { if (e.target.matches(":focus-visible")) { tourPaused = true; tourRestart(); } });
tour.addEventListener("focusout", (e) => { if (!tour.contains(e.relatedTarget)) { tourPaused = false; tourRestart(); } });

// ---- The header's parts that never change with the language
$("#logo").innerHTML = LOGO;
$("#prev").innerHTML = ic("chevron-left");
$("#next").innerHTML = ic("chevron-right");
$("#menuBtn").onclick = () => setMenu(!$("#menu").classList.contains("open"));
function setMenu(open) {
  $("#menu").classList.toggle("open", open);
  $("#menuBtn").setAttribute("aria-expanded", open);
  $("#menuBtn").innerHTML = ic(open ? "x" : "menu") + tr().menu;
}
$("#langBtn").onclick = (e) => {
  e.stopPropagation();
  const list = $("#langList");
  list.hidden = !list.hidden;
  $("#langBtn").setAttribute("aria-expanded", !list.hidden);
};
document.addEventListener("click", () => { $("#langList").hidden = true; $("#langBtn").setAttribute("aria-expanded", false); });

// ---- Light or dark: the switch shows the theme it leads to
const isLight = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) === "light";
function themeIcon() { $("#themeBtn").innerHTML = ic(isLight() ? "moon" : "sun"); }
$("#themeBtn").onclick = () => { document.documentElement.dataset.theme = isLight() ? "dark" : "light"; themeIcon(); };

// ---- Everything with text
function render() {
  const t = tr();
  document.documentElement.lang = state.lang;
  $("#menu").innerHTML = ["plug", "play", "own"].map((s) => `<li><a href="#${s}" data-section="${s}">${SLOGAN[s]}</a></li>`).join("");
  $("#menu").querySelectorAll("a").forEach((a) => a.addEventListener("click", () => setMenu(false)));
  $("#side").innerHTML = SECTIONS.map((s) => {
    const name = s === "home" ? t.home : s === "download" ? "Download" : SLOGAN[s];
    return `<a href="#${s}" data-section="${s}" aria-label="${name}" title="${name}"></a>`;
  }).join("");
  $("#get").textContent = t.get;
  setMenu($("#menu").classList.contains("open"));
  $("#langBtn").innerHTML = ic("globe") + `<span class="code">${state.lang.toUpperCase()}</span>` + ic("chevron-down", "chev");
  $("#langBtn").setAttribute("aria-label", t.language);
  $("#themeBtn").setAttribute("aria-label", t.theme);
  $("#themeBtn").title = t.theme;
  $("#langList").innerHTML = LANGS.map(([c, name]) => `<li><a href="#" data-lang="${c}" lang="${c}"${c === state.lang ? ' aria-current="true"' : ""}>${name}${c === state.lang ? ic("check") : ""}</a></li>`).join("");
  $("#langList").querySelectorAll("[data-lang]").forEach((a) => a.onclick = (e) => {
    e.preventDefault();
    const code = a.dataset.lang;
    if (!T[code]) { notice(t.other.replace("{name}", a.textContent).replace("{code}", code)); return; }
    state.lang = code;
    const url = new URL(location.href);
    url.searchParams.set("lang", code);
    history.replaceState(null, "", url);
    render();
  });

  // Home
  track.innerHTML = slideHtml(n - 1, true) + SLIDES.map((_, i) => slideHtml(i, false)).join("") + slideHtml(0, true);
  $("#pips").innerHTML = SLIDES.map((_, i) => `<button type="button" aria-label="${t.card.replace("{n}", i + 1).replace("{total}", n)}"></button>`).join("");
  $("#pips").querySelectorAll("button").forEach((b, i) => b.onclick = () => go(i));
  $("#prev").setAttribute("aria-label", t.previous);
  $("#next").setAttribute("aria-label", t.next);
  $("#made").textContent = t.made;
  $("#made").dataset.page = t.credits;
  setSlide(state.slide);
  jump(state.slide + 1);

  // Plug it.
  $("#plugTitle").textContent = SLOGAN.plug;
  $("#plugLede").textContent = t.plugLede;
  $("#infos").innerHTML = [["book-open", t.guide, t.guideText], ["circle-help", t.faq, t.faqText]].map(([icon, name, text]) =>
    `<a class="info" href="#" data-page="${name}"><span class="icon">${ic(icon)}</span><b>${name}</b><span>${text}</span></a>`).join("");

  // Play it.
  $("#playTitle").textContent = SLOGAN.play;
  $("#playLede").textContent = t.playLede;
  $("#moves").innerHTML = MOVES.map((m, i) => `<li><button class="move" type="button"><span class="glyphs">${typeof m.glyphs === "function" ? m.glyphs() : m.glyphs}</span><span>${t.moves[i]}</span></button></li>`).join("");
  $("#moves").querySelectorAll(".move").forEach((b, i) => b.onclick = () => { setMove(i); tourRestart(); });
  $("#screens").innerHTML = MOVES.map((m) => `<img class="shot" src="${PICS}${m.pic}.webp" alt="">`).join("");
  setMove(state.move);

  // Own it!
  $("#ownTitle").textContent = SLOGAN.own;
  $("#ownLede").textContent = t.ownLede;
  $("#facts").innerHTML = FACTS.map((icon, i) => `<div class="fact"><span class="icon">${ic(icon)}</span><b>${t.facts[i]}</b></div>`).join("");

  // Download and the footer
  $("#dlTitle").textContent = t.dlTitle;
  $("#dlBtn").textContent = t.dlBtn;
  $("#dlBtn").onclick = (e) => { e.preventDefault(); notice(t.soon); };
  $("#foot").innerHTML = `<a href="#home" aria-label="OwneetOS">${LOGO}</a>` +
    [t.guide, t.faq, t.contribute, t.source, t.credits, t.privacy].map((name) => `<a href="#" data-page="${name}">${name}</a>`).join("") +
    `<span>${t.licence}</span><span class="marks">${t.marks}</span>`;
  markSection();
}

// ---- The address and the header follow the section on screen
function markSection() {
  document.querySelectorAll("[data-section]").forEach((a) => a.setAttribute("aria-current", a.dataset.section === state.section));
}
const follow = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    state.section = entry.target.id;
    markSection();
    history.replaceState(null, "", location.pathname + location.search + (state.section === "home" ? "" : "#" + state.section));
  }
}, { threshold: 0.55 });
SECTIONS.forEach((s) => follow.observe(document.getElementById(s)));
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; restart(); }, { threshold: 0.5 }).observe(carousel);
new IntersectionObserver(([e]) => { tourOn = e.isIntersecting; tourRestart(); }, { threshold: 0.5 }).observe(tour);
document.addEventListener("visibilitychange", () => { restart(); tourRestart(); });

themeIcon();
render();
addEventListener("resize", () => jump(state.slide + 1));
</script>
</body>
</html>
