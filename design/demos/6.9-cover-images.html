<!-- OwneetOS - interactive demo for [[step-6.9-cover-images-from-a-disk]] (owner 2026-11-09, 2026-11-17): a local game's
     cover from a picture on a stick or disk. While a disk with an "Images" folder (Immagini, Bilder, Imágenes; any case;
     at the disk's top) is plugged in, Options on a local game offers "Add cover image" (no cover yet) or "Change cover
     image" (it has one); nothing announces the pictures. It opens a window: on the left the pictures by name (the
     folder's and its sub-folders', a sub-folder's name before the file's), scrolling vertically as the credits; on the
     right the selected picture as the cover will look (its middle, cut to the cover's shape). A uses it: the picture is
     copied into the game's folder as cover.<ext> (an earlier cover replaced) and the cover changes at once. Not offered
     for a game on a read-only disk, nor for Steam games (Steam has their covers). Formats: PNG, JPEG, WebP. Pictures are
     drawn here, invented. Open in a browser; drive it with a gamepad or the keyboard. Fonts are loaded from Google Fonts
     for the demo only: the console bundles the font files (SIL Open Font License). -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwneetOS - Cover images from a disk (demo 6.9)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Lexend:wght@300..600&display=swap">
<style>
:root { --display: "Bricolage Grotesque", system-ui, sans-serif; --text: "Lexend", system-ui, sans-serif; --ts: 1;
  --bg: #0E1424; --surface: #172036; --raised: #222D4A; --line: #2E3A5C; --fg: #EEF1F8; --muted: #8F9AB5; --accent: #FF8A5B; --on-accent: #1E0E06; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05070C; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; font-family: var(--text); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }
.frame { position: relative; flex: none; }
.stage { width: 1280px; height: 720px; position: absolute; top: 0; left: 0; overflow: hidden; transform-origin: top left;
  background: var(--bg); color: var(--fg); padding: 36px 64px 28px; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 18px;
  font-size: calc(16px * var(--ts)); line-height: 1.35; font-weight: 350; }
.t-xs { font-size: calc(12.5px * var(--ts)); } .t-s { font-size: calc(14.5px * var(--ts)); }
.t-m { font-size: calc(17px * var(--ts)); } .t-l { font-size: calc(24px * var(--ts)); } .t-xl { font-size: calc(40px * var(--ts)); }
.disp { font-family: var(--display); font-variation-settings: "wdth" 82; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.muted { color: var(--muted); }
.top { display: flex; align-items: center; justify-content: space-between; }
.top-left { display: flex; align-items: center; gap: 36px; }
.mark { font-family: var(--display); font-weight: 800; font-variation-settings: "wdth" 78; font-size: 23px; letter-spacing: -0.03em; }
.mark i { font-style: normal; color: var(--accent); }
.tabs { display: flex; gap: 6px; align-items: center; }
.tab { padding: 7px 18px; border-radius: 999px; color: var(--muted); }
.tab[aria-current="page"] { background: var(--fg); color: var(--bg); font-weight: 500; }
.clock { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.head { display: flex; align-items: baseline; gap: 14px; justify-content: space-between; }
.head h1 { margin: 0; }
.filters { display: flex; gap: 8px; }
.chip { padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(7, 152px); gap: 16px 14px; align-content: start; }
.cover { position: relative; height: 190px; border-radius: 14px; color: #fff; overflow: hidden; }
.cover .art { position: absolute; inset: 0; background-size: cover; background-position: center; }
.cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%); }
.cover .badge { position: absolute; left: 8px; top: 8px; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.45); }
.cover .body { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; gap: 4px; }
.cover .title { font-size: calc(17px * var(--ts)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cover.focus { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6.5px var(--accent), 0 12px 28px -10px rgba(0,0,0,.55); overflow: visible; }
.cover.focus .art, .cover.focus .shade { border-radius: 14px; }
.prompts { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.prompts .set { display: flex; gap: 24px; }
.prompt { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.g { height: calc(26px * var(--ts)); width: auto; color: var(--fg); flex: none; vertical-align: middle; }

.dim { position: absolute; inset: 0; z-index: 5; background: rgba(8, 11, 20, .72); display: none; }
.dim.on { display: block; }
.sheet { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -54%); min-width: 520px; max-width: 1060px;
  padding: 26px 28px 28px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); display: none; text-align: center; }
.sheet.on { display: grid; gap: 18px; justify-items: center; }
.sheet .list { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 20px; }
.sheet .item { padding: 11px 26px; border-radius: 999px; font-weight: 500; background: var(--raised); color: var(--fg); white-space: nowrap; }
.sheet .item.primary { background: var(--accent); color: var(--on-accent); }
.sheet .item.focus { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6.5px var(--accent); }
.sheet-prompts { position: absolute; z-index: 6; left: 64px; right: 64px; bottom: 28px; display: none; }
.sheet-prompts.on { display: flex; }

/* the picker: names on the left (scrolling), the cover as it will look on the right */
.picker { position: absolute; z-index: 6; left: 64px; right: 64px; top: 40px; bottom: 82px; border-radius: 18px; background: var(--bg);
  border: 1px solid var(--line); padding: 24px 28px; display: none; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; gap: 14px 28px; }
.picker.on { display: grid; }
.picker h2 { margin: 0; grid-column: 1 / -1; }
.picker .names { display: grid; gap: 6px; align-content: start; overflow: hidden; padding: 6px; margin: -6px; }
.picker .name { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 14px; border-radius: 12px; background: var(--surface); }
.picker .name .folder { color: var(--muted); }
.picker .name.focus { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6.5px var(--accent); }
.picker .side { display: grid; gap: 10px; justify-items: center; align-content: start; }
.picker .side .cover { width: 240px; height: 300px; }
.toast { position: absolute; z-index: 9; right: 64px; top: 88px; padding: 14px 20px; border-radius: 14px; background: var(--surface);
  border: 1px solid var(--line); opacity: 0; transition: opacity .2s; }
.toast.on { opacity: 1; }

.demo-bar { display: flex; gap: 22px; align-items: center; color: #8a90a0; font: 12px/1.4 system-ui, sans-serif; flex-wrap: wrap; justify-content: center; }
.demo-bar .grp { display: inline-flex; gap: 6px; align-items: center; }
.demo-bar button { padding: 3px 10px; border-radius: 999px; border: 1px solid #333a4a; color: #c9cdd8; font: inherit; }
.demo-bar button[aria-pressed="true"] { background: #c9cdd8; color: #05070C; }
.help { margin: 0; color: #8a90a0; font: 12px/1.45 system-ui, sans-serif; text-align: center; padding-inline: 12px; }
.help b { color: #c9cdd8; font-weight: 600; }
</style>
</head>
<body>

<div class="frame" id="frame"><div class="stage" id="stage">
  <header class="top">
    <div class="top-left"><span class="mark">Owneet<i>OS</i></span>
      <nav class="tabs t-s"><span class="tab" data-t="tab.home"></span><span class="tab" aria-current="page" data-t="tab.library"></span><span class="tab" data-t="tab.settings"></span></nav></div>
    <span class="clock t-s" id="clock">10:30</span>
  </header>
  <div class="head"><span><h1 class="disp t-xl" data-t="tab.library" style="display:inline"></h1> <span class="muted t-m" id="count"></span></span></div>
  <div class="filters t-s"><span class="chip" data-t="f.all"></span><span class="chip" data-t="f.installed"></span><span class="chip" aria-current="true" data-t="f.local"></span></div>
  <main class="grid" id="grid"></main>
  <footer class="prompts t-s" id="pagePrompts"><div class="set" id="pl"></div><div class="set" id="pr"></div></footer>

  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="picker" id="picker">
    <h2 class="disp t-l" id="pickTitle"></h2>
    <div class="names t-m" id="names"></div>
    <div class="side"><div class="cover" id="preview"><div class="art"></div><div class="shade"></div><span class="badge t-xs"></span><div class="body"><span class="disp title"></span></div></div>
      <span class="muted t-s" id="previewNote"></span></div>
  </div>
  <footer class="prompts sheet-prompts t-s" id="sheetPrompts"><div class="set" id="shl"></div><div class="set" id="shr"></div></footer>
  <div class="toast t-s" id="toast"></div>
</div></div>

<div class="demo-bar" id="demo-bar">
  <span class="grp"><span>USB disk with pictures:</span><button data-usb="on" aria-pressed="true">plugged in</button><button data-usb="off">unplugged</button></span>
  <span class="grp"><span>Game's disk:</span><button data-ro="off" aria-pressed="true">writable</button><button data-ro="on">read only</button></span>
  <span class="grp"><span>Text size:</span><button data-ts="1" aria-pressed="true">M</button><button data-ts="1.2">L</button><button data-ts="1.4">XL</button></span>
  <span class="grp"><span>Language:</span><button data-lang="it" aria-pressed="true">Italiano</button><button data-lang="en">English</button></span>
  <span class="grp"><button data-reset="1">Start again</button></span>
</div>
<p class="help"><b>Gamepad:</b> D-pad / stick move, A select, B back, Menu (☰) Options. <b>Keyboard:</b> arrows, Enter = A, Esc = B, M = Menu.
The Witcher 2 (first cover) has no cover yet. The pictures are invented.</p>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const stage = $('#stage');

  const EN = { 'tab.home': 'Home', 'tab.library': 'Library', 'tab.settings': 'Settings', 'f.all': 'All', 'f.installed': 'Installed', 'f.local': 'Local',
    'local': 'Local', 'games': '{n} games', 'p.play': 'Play', 'p.details': 'Details', 'p.options': 'Options', 'p.sort': 'Sort', 'p.filter': 'Filter',
    'p.menu': 'Menu', 'p.select': 'Select', 'p.back': 'Back', 'p.use': 'Use this picture', 'p.cancel': 'Cancel', 'p.sections': 'Sections', 'p.home': 'Home',
    'o.play': 'Play', 'o.details': 'Details', 'o.move': 'Move to another disk', 'o.fav': 'Add to favorites', 'o.uninstall': 'Uninstall',
    'o.add': 'Add cover image', 'o.change': 'Change cover image',
    'pick.title': 'Cover image for {g}', 'pick.note': 'As the cover will look', 'pick.from': 'From {disk} · {n} pictures',
    't.added': 'Cover image of {g} changed', 'other': 'Only The Witcher 2 and Lantern Keep do something in this demo',
    'disk.int': 'Internal disk', 'disk.sata': '2TB HDD SATA' };
  const IT = { 'tab.home': 'Home', 'tab.library': 'Libreria', 'tab.settings': 'Impostazioni', 'f.all': 'Tutti', 'f.installed': 'Installati', 'f.local': 'Locali',
    'local': 'Locale', 'games': '{n} giochi', 'p.play': 'Gioca', 'p.details': 'Dettagli', 'p.options': 'Opzioni', 'p.sort': 'Ordina', 'p.filter': 'Filtro',
    'p.menu': 'Menu', 'p.select': 'Seleziona', 'p.back': 'Indietro', 'p.use': 'Usa questa immagine', 'p.cancel': 'Annulla', 'p.sections': 'Sezioni', 'p.home': 'Home',
    'o.play': 'Gioca', 'o.details': 'Dettagli', 'o.move': 'Sposta su un altro disco', 'o.fav': 'Aggiungi ai preferiti', 'o.uninstall': 'Disinstalla',
    'o.add': 'Aggiungi immagine di copertina', 'o.change': 'Cambia immagine di copertina',
    'pick.title': 'Immagine di copertina per {g}', 'pick.note': 'Come apparirà la copertina', 'pick.from': 'Da {disk} · {n} immagini',
    't.added': 'Copertina di {g} cambiata', 'other': 'In questa demo fanno qualcosa solo The Witcher 2 e Lantern Keep',
    'disk.int': 'Disco interno', 'disk.sata': '2TB HDD SATA' };
  let lang = 'it';
  const tr = (k, a = {}) => ((lang === 'it' ? IT : EN)[k] || EN[k] || k).replace(/\{(\w+)\}/g, (_, x) => a[x]);

  /* ---------- Invented pictures, drawn here ---------- */
  function picture(seed, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    const hue = (seed * 67) % 360;
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, `hsl(${hue},55%,${30 + seed % 3 * 8}%)`); g.addColorStop(1, `hsl(${(hue + 40) % 360},45%,12%)`);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = `hsl(${(hue + 180) % 360},60%,70%)`;
    x.beginPath(); x.arc(w * (0.3 + (seed % 5) * 0.1), h * 0.3, Math.min(w, h) * 0.12, 0, 7); x.fill();
    for (let i = 0; i < 3; i++) {
      x.fillStyle = `hsla(${(hue + 20 * i) % 360},40%,${18 + i * 8}%,.9)`;
      x.beginPath(); x.moveTo(0, h * (0.62 + i * 0.1));
      for (let k = 0; k <= 8; k++) x.lineTo(w * k / 8, h * (0.55 + i * 0.1) - Math.sin(seed + k * (1.3 + i)) * h * 0.08);
      x.lineTo(w, h); x.lineTo(0, h); x.fill();
    }
    return c.toDataURL('image/jpeg', .85);
  }
  const PICS = [['', 'castle-at-dawn.jpg', 3, 1600, 900], ['', 'forest-path.png', 5, 1200, 1600], ['', 'mountains.webp', 7, 1920, 1080],
    ['Witcher', 'cover-front.jpg', 11, 900, 1200], ['Witcher', 'map.png', 13, 2000, 1400], ['Viaggio 2026', 'lake.jpg', 17, 1600, 1200],
    ['Viaggio 2026', 'old-bridge.jpg', 19, 1200, 1500], ['Viaggio 2026', 'sunset.webp', 23, 1920, 1080], ['', 'wallpaper-blue.png', 29, 1920, 1080]]
    .map(([folder, name, seed, w, h]) => ({ folder, name, src: picture(seed, w / 5, h / 5) }));
  const GAMES = [{ t: 'The Witcher 2 - Win', disk: 'disk.sata', c: ['#d0436f', '#3a1022'] }, { t: 'Lantern Keep', disk: 'disk.sata', c: ['#e0c040', '#3a3010'], img: picture(31, 300, 380) },
    { t: 'Moss Garden', disk: 'disk.int', c: ['#40c060', '#10301a'] }, { t: 'Nebula Drift', disk: 'disk.sata', c: ['#e04a5a', '#3a1016'] },
    { t: 'Quiet Orbit', disk: 'disk.sata', c: ['#9b59d0', '#24123a'] }, { t: 'Starfall', disk: 'disk.int', c: ['#e08a40', '#3a2010'] }];
  GAMES[0].t = 'The Witcher 2: Assassin of kings';
  let usb = true, readOnly = false, focusIndex = 0;

  const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const circle = inner => `<svg class="g" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.8"/>${inner}</svg>`;
  const letter = l => circle(`<text x="13" y="17.6" text-anchor="middle" font-family="Lexend, sans-serif" font-weight="600" font-size="13" fill="currentColor">${l}</text>`);
  const pill = (t, w) => `<svg class="g" viewBox="0 0 ${w} 26"><rect x="1" y="1" width="${w - 2}" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="${w / 2}" y="17.4" text-anchor="middle" font-family="Lexend, sans-serif" font-weight="600" font-size="11.5" fill="currentColor">${t}</text></svg>`;
  const G = { a: letter('A'), b: letter('B'), x: letter('X'), y: letter('Y'), menu: circle(`<path d="M8.5 9.5h9M8.5 13h9M8.5 16.5h9" ${S}/>`),
    lb: pill('LB', 34), rb: pill('RB', 34), lt: pill('LT', 34), rt: pill('RT', 34), guide: circle(`<path d="M8 13.2 13 8.8l5 4.4M9.6 12v5.4h6.8V12" ${S}/>`) };
  const P = (b, l) => `<span class="prompt">${b.map(x => G[x]).join('')}<span>${tr(l)}</span></span>`;
  const art = g => g.img ? `background-image:url(${g.img})` : `background: radial-gradient(120% 90% at 70% 10%, ${g.c[0]}, ${g.c[1]} 80%)`;

  function drawLibrary() {
    document.documentElement.lang = lang;
    $$('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
    $('#count').textContent = tr('games', { n: GAMES.length });
    $('#grid').innerHTML = GAMES.map((g, i) => `<div class="cover${i === focusIndex ? ' focus' : ''}"><div class="art" style="${art(g)}"></div><div class="shade"></div>
      <span class="badge t-xs">${tr('local')}</span><div class="body"><span class="disp title">${g.t}</span><span class="t-xs" style="opacity:.85">${tr(g.disk)}</span></div></div>`).join('');
    $('#pl').innerHTML = P(['a'], 'p.play') + P(['x'], 'p.details') + P(['menu'], 'p.options') + P(['y'], 'p.sort') + P(['lt', 'rt'], 'p.filter') + P(['b'], 'p.menu');
    $('#pr').innerHTML = P(['lb', 'rb'], 'p.sections') + P(['guide'], 'p.home');
  }

  /* ---------- Windows ---------- */
  let sheet = null, picking = null;
  function prompts(left) {
    $('#pagePrompts').style.visibility = 'hidden'; $('#sheetPrompts').classList.add('on');
    $('#shl').innerHTML = left; $('#shr').innerHTML = P(['guide'], 'p.home');
  }
  function closeAll() {
    sheet = null; picking = null;
    $('#dim').classList.remove('on'); $('#sheet').classList.remove('on'); $('#picker').classList.remove('on');
    $('#sheetPrompts').classList.remove('on'); $('#pagePrompts').style.visibility = '';
  }
  function options() {
    const g = GAMES[focusIndex];
    const items = [['play', 'o.play', true], ['details', 'o.details'], ['move', 'o.move'], ['fav', 'o.fav']];
    // only while a disk with pictures is plugged in, never on a read-only disk (6.9)
    if (usb && !(readOnly && g.disk === 'disk.sata')) items.push(['cover', g.img ? 'o.change' : 'o.add']);
    items.push(['uninstall', 'o.uninstall']);
    $('#sheet').innerHTML = `<span class="disp t-l">${g.t}</span><div class="list t-m">${items.map(([k, l, p]) =>
      `<button class="item${p ? ' primary' : ''}" data-k="${k}">${tr(l)}</button>`).join('')}</div>`;
    $('#dim').classList.add('on'); $('#sheet').classList.add('on');
    prompts(P(['a'], 'p.select') + P(['b'], 'p.back'));
    sheet = { items: $$('#sheet [data-k]'), index: 0 };
    focusSheet();
  }
  function focusSheet() { sheet.items.forEach((el, i) => el.classList.toggle('focus', i === sheet.index)); }
  function pickSheet() {
    const k = sheet.items[sheet.index].dataset.k;
    if (k === 'cover') { sheet = null; $('#sheet').classList.remove('on'); openPicker(); }
    else { closeAll(); toast(tr('other')); }
  }
  function openPicker() {
    const g = GAMES[focusIndex];
    $('#pickTitle').textContent = tr('pick.title', { g: g.t });
    picking = { index: 0, top: 0 };
    $('#picker').classList.add('on');
    prompts(P(['a'], 'p.use') + P(['b'], 'p.cancel'));
    drawPicker();
  }
  const ROWS = 9;
  function drawPicker() {
    const g = GAMES[focusIndex];
    if (picking.index < picking.top) picking.top = picking.index;
    if (picking.index >= picking.top + ROWS) picking.top = picking.index - ROWS + 1;
    $('#names').innerHTML = `<span class="muted t-s">${tr('pick.from', { disk: 'USB-FOTO', n: PICS.length })}</span>` +
      PICS.slice(picking.top, picking.top + ROWS).map((p, j) => `<div class="name${picking.top + j === picking.index ? ' focus' : ''}">
      <span>${p.folder ? `<span class="folder">${p.folder} / </span>` : ''}${p.name}</span><span class="muted t-s">${p.name.split('.').pop().toUpperCase()}</span></div>`).join('');
    const pv = $('#preview'), p = PICS[picking.index];
    pv.querySelector('.art').style.cssText = `background-image:url(${p.src})`;
    pv.querySelector('.badge').textContent = tr('local');
    pv.querySelector('.title').textContent = g.t;
    $('#previewNote').textContent = tr('pick.note');
  }
  function usePicture() {
    const g = GAMES[focusIndex];
    g.img = PICS[picking.index].src;
    closeAll(); drawLibrary();
    toast(tr('t.added', { g: g.t }));
  }
  let tt = 0;
  function toast(t) { $('#toast').textContent = t; $('#toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('on'), 2600); }

  /* ---------- Input ---------- */
  function act(a) {
    if (picking) {
      if (a === 'up') picking.index = Math.max(0, picking.index - 1);
      else if (a === 'down') picking.index = Math.min(PICS.length - 1, picking.index + 1);
      else if (a === 'a') { usePicture(); return; }
      else if (a === 'b') { closeAll(); return; }
      drawPicker(); return;
    }
    if (sheet) {
      if (a === 'left' || a === 'up') { sheet.index = Math.max(0, sheet.index - 1); focusSheet(); }
      else if (a === 'right' || a === 'down') { sheet.index = Math.min(sheet.items.length - 1, sheet.index + 1); focusSheet(); }
      else if (a === 'a') pickSheet();
      else if (a === 'b') closeAll();
      return;
    }
    if (a === 'left') focusIndex = Math.max(0, focusIndex - 1);
    else if (a === 'right') focusIndex = Math.min(GAMES.length - 1, focusIndex + 1);
    else if (a === 'menu') { options(); return; }
    else if (a === 'a') { toast(tr('other')); return; }
    drawLibrary();
  }
  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'a', Escape: 'b', Backspace: 'b', m: 'menu', M: 'menu' };
    if (map[e.key]) { e.preventDefault(); act(map[e.key]); }
  });
  const BTN = { 0: 'a', 1: 'b', 9: 'menu' };
  let prev = {}, repeatAt = 0, lastDir = null;
  function poll(ts) {
    const pad = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean)[0] : null;
    if (pad) {
      for (const [i, a] of Object.entries(BTN)) { const on = !!(pad.buttons[i] && pad.buttons[i].pressed); if (on && !prev[i]) act(a); prev[i] = on; }
      const on = i => !!(pad.buttons[i] && pad.buttons[i].pressed);
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      const dir = on(14) || ax < -0.5 ? 'left' : on(15) || ax > 0.5 ? 'right' : on(12) || ay < -0.5 ? 'up' : on(13) || ay > 0.5 ? 'down' : null;
      if (dir && ts > repeatAt) { act(dir); repeatAt = ts + (lastDir === dir ? 140 : 360); }
      lastDir = dir; if (!dir) repeatAt = 0;
    }
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);

  $('#demo-bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.reset) { GAMES[0].img = undefined; focusIndex = 0; }
    else {
      $$('button', b.closest('.grp')).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (b.dataset.usb) usb = b.dataset.usb === 'on';
      if (b.dataset.ro) readOnly = b.dataset.ro === 'on';
      if (b.dataset.ts) document.documentElement.style.setProperty('--ts', b.dataset.ts);
      if (b.dataset.lang) lang = b.dataset.lang;
    }
    closeAll(); drawLibrary(); b.blur();
  });
  function fit() {
    const s = Math.min(innerWidth / 1280, (innerHeight - 70) / 720);
    stage.style.transform = `scale(${s})`;
    $('#frame').style.width = 1280 * s + 'px'; $('#frame').style.height = 720 * s + 'px';
  }
  addEventListener('resize', fit); fit();
  const clock = () => { $('#clock').textContent = new Date().toTimeString().slice(0, 5); };
  clock(); setInterval(clock, 10000);

  /* ---------- Optional start state: #lang=en&open=options|picker ---------- */
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('lang') === 'en') { lang = 'en'; $$('[data-lang]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.lang === 'en'))); }
  drawLibrary();
  if (q.get('open') === 'options') options();
  if (q.get('open') === 'picker') { picking = null; openPicker(); $('#dim').classList.add('on'); if (q.get('at')) { picking.index = +q.get('at'); drawPicker(); } }
})();
</script>
</body>
