<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- OwneetOS — interactive demo for [[step-7.8-website]]: the website's home, a one-page site
     ([[website]]). Owner's feedback of 2026-10-20 on the first demo: each section is one screen
     and the scrolling snaps from one to the next; the address follows the section on screen
     (#features, #requirements, ...) and a link to it scrolls there; less text: the features are
     a carousel, a title and one short line, one card on screen, the next half a screen away; it
     plays by itself every 5 s and loops (it stops only while pointed at or focused, and off
     screen; no pause button, owner, 2026-10-20), also moved by the arrows, the dots and
     a swipe; the console picture follows the approved
     home screen (demo 3.6) with generic apps (Video streaming, Audio streaming, Local videos,
     Local music, Local pictures, All apps). English and Italian (the real site takes its texts
     from translation files). The links to the other pages (guide, FAQ, credits, privacy,
     contributing) come with their own demos. The demo panel at the bottom left (not part of the
     site) switches palette, light / dark and the logo (the 7.6 draft or the current one); start
     state in the address: #features&lang=it&pal=dusk&logo=current. The console picture is drawn
     for the demo; the game names are invented. Fonts come from Google Fonts for the demo only:
     the real site serves its own fonts (no third-party requests, no data collected). Open in a
     browser; mouse, keyboard (arrows in the carousel) and touch. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwneetOS — Website home (demo 7.8)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Lexend:wght@300..600&display=swap">
<style>
:root { --bg: #0E1424; --surface: #172036; --raised: #222D4A; --line: #2E3A5C; --fg: #EEF1F8;
  --muted: #8F9AB5; --accent: #FF8A5B; --on-accent: #1E0E06;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --text: "Lexend", system-ui, sans-serif;
  --wrap: 1160px; --head: 68px; }
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--text); font-weight: 350; line-height: 1.5; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; width: 100%; }
.disp { font-family: var(--display); font-variation-settings: "wdth" 82; font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
.muted { color: var(--muted); }
.wm-text { fill: var(--fg); } .wm-accent { fill: var(--accent); }

/* Header */
header.site { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: var(--head);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); }
.nav { display: flex; align-items: center; gap: 28px; height: 100%; }
.nav .logo { display: flex; align-items: center; }
.nav .logo svg { height: 30px; width: auto; display: block; }
.nav ul { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
.nav ul a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 999px; font-size: 15px; }
.nav ul a:hover, .nav ul a[aria-current="true"] { color: var(--fg); }
.nav ul a[aria-current="true"] { background: var(--surface); }
.nav .end { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { background: none; border: 0; padding: 4px 10px; border-radius: 999px; font-size: 13px; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1px solid transparent; cursor: pointer;
  border-radius: 999px; padding: 12px 24px; font-size: 16px; font-weight: 500; transition: transform .15s ease; background: none; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { border-color: var(--line); color: var(--fg); }
.btn.small { padding: 8px 16px; font-size: 14px; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }

/* Sections: one screen each, snapped */
.snap { min-height: 100svh; scroll-snap-align: start; padding: calc(var(--head) + 32px) 0 48px; display: flex; align-items: center; }
.snap > .wrap { display: grid; gap: 36px; }
.snap > .wrap > * { min-width: 0; }   /* the carousel's strip must not widen the page */
html, body { overflow-x: clip; }
.head { text-align: center; display: grid; gap: 12px; justify-items: center; }
.head h2 { font-size: clamp(34px, 5vw, 56px); margin: 0; }
.head p { color: var(--muted); font-size: 18px; margin: 0; max-width: 30em; }

/* Dots: where we are, on the right */
.dots { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 15; display: grid; gap: 12px; }
.dots a { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; transition: transform .2s ease, background .2s ease; }
.dots a[aria-current="true"] { background: var(--accent); transform: scale(1.35); }

/* Hero */
.hero { grid-template-columns: 1fr 1.25fr; align-items: center; }
.kicker { color: var(--accent); font-weight: 500; font-size: 15px; margin: 0 0 14px; }
.hero h1 { font-size: clamp(42px, 6vw, 70px); margin: 0 0 18px; }
.hero p.lede { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 26em; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; }

/* The console's home screen (as in demo 3.6, drawn for the site) */
.tv { container-type: inline-size; }
.tv .screen { aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--bg);
  border: 10px solid #05070C; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6), 0 0 0 1px var(--line);
  font-size: 1.32cqw; padding: 2.2em 2.8em 1.6em; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 1.3em; }
.tv .stand { width: 26%; height: 14px; margin: 0 auto; background: #05070C; border-radius: 0 0 10px 10px; }
.tv .top { display: flex; align-items: center; gap: 2.2em; }
.tv .top svg { height: 1.7em; width: auto; display: block; }
.tv .tabs { display: flex; align-items: center; gap: .5em; color: var(--muted); }
.tv .tabs b { background: var(--fg); color: var(--bg); font-weight: 500; border-radius: 999px; padding: .3em 1.1em; }
.tv .tabs i { font-style: normal; padding: .3em .8em; }
.tv .pill { font-size: .7em; font-weight: 600; border: .14em solid var(--muted); border-radius: .5em; padding: .05em .45em; color: var(--muted); }
.tv .status { margin-left: auto; display: flex; gap: 1.2em; align-items: center; color: var(--muted); }
.tv .status svg { width: 1.3em; height: 1.3em; display: block; }
.tv .main { display: grid; grid-template-columns: 1.65fr 1fr; gap: 1.3em; min-height: 0; }
.tv .card { position: relative; border-radius: 1.1em; overflow: hidden; padding: 1.5em 1.8em; color: #fff; display: flex; flex-direction: column;
  justify-content: flex-end; gap: .55em; outline: .22em solid var(--accent); outline-offset: .22em;
  background: radial-gradient(70% 90% at 85% 15%, hsl(330 85% 62% / .85), transparent 60%),
    radial-gradient(60% 80% at 60% 110%, hsl(10 70% 42%), transparent 70%), linear-gradient(135deg, hsl(330 45% 22%), hsl(0 55% 10%)); }
.tv .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.55), transparent 70%); }
.tv .card > * { position: relative; }
.tv .card .k { font-size: .75em; letter-spacing: .12em; text-transform: uppercase; opacity: .85; font-weight: 500; }
.tv .card .t { font-family: var(--display); font-variation-settings: "wdth" 82; font-weight: 750; font-size: 2.3em; line-height: 1; }
.tv .card .meta { display: flex; gap: 1em; font-size: .8em; opacity: .9; }
.tv .card .meta span:first-child { background: rgba(0,0,0,.35); border-radius: 999px; padding: .1em .7em; }
.tv .card .acts { display: flex; gap: .8em; margin-top: .3em; }
.tv .card .acts span { border-radius: 999px; padding: .45em 1.4em; font-weight: 500; background: rgba(255,255,255,.16); }
.tv .card .acts span:first-child { background: #fff; color: #10131C; }
.tv .side { display: grid; grid-template-rows: auto 1fr; gap: .7em; min-height: 0; }
.tv .label { font-size: .75em; color: var(--muted); }
.tv .apps { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: .7em; }
.tv .app { border-radius: .9em; background: var(--surface); border: .08em solid var(--line); padding: .6em .7em; display: flex; flex-direction: column;
  justify-content: space-between; gap: .4em; font-size: .78em; line-height: 1.15; }
.tv .app .ico { width: 2.1em; height: 2.1em; border-radius: .6em; display: grid; place-items: center; background: var(--raised); color: var(--accent); }
.tv .app .ico svg { width: 1.3em; height: 1.3em; }
.tv .rowhead { display: flex; justify-content: space-between; font-size: .75em; color: var(--muted); margin-bottom: .6em; }
.tv .rowhead b { color: var(--fg); font-weight: 400; }
.tv .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: .8em; }
.tv .cover { aspect-ratio: 4 / 5; border-radius: .8em; color: #fff; display: flex; align-items: flex-end; padding: .5em; font-size: .72em; font-weight: 500;
  background: radial-gradient(120% 80% at 80% 10%, hsl(var(--h) 85% 62% / .95), transparent 60%),
    radial-gradient(90% 70% at 0% 100%, hsl(calc(var(--h) + 40) 70% 35%), transparent 70%), hsl(var(--h) 40% 18%); }
.tv .prompts { display: flex; justify-content: space-between; color: var(--muted); font-size: .75em; }
.tv .prompts > span { display: flex; gap: 1.4em; }
.tv .prompts i { font-style: normal; display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; border-radius: 50%;
  border: .12em solid var(--muted); font-size: .8em; font-weight: 600; margin-right: .4em; }

/* Carousel */
/* The strip spans the whole screen; at rest only the middle card is on screen (the next one is a
   whole screen away), and while they slide the cards come in and go out at the screen's edges. */
.carousel { position: relative; margin: 0 calc(50% - 50vw); --card: min(600px, 84vw); }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none;
  padding: 8px calc(50vw - var(--card) / 2); gap: calc(50vw - var(--card) / 2); }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 var(--card); scroll-snap-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  padding: 44px 40px; display: grid; justify-items: center; text-align: center; gap: 14px; }
.slide .icon { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.slide .icon svg { width: 44px; height: 44px; }
.slide h3 { font-family: var(--display); font-variation-settings: "wdth" 85; font-weight: 750; font-size: 30px; margin: 6px 0 0; letter-spacing: -0.01em; }
.slide p { margin: 0; color: var(--muted); font-size: 17px; max-width: 24em; }
.cnav { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 22px; }
.cnav button.arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.cnav button.arrow svg { width: 20px; height: 20px; }.cdots { display: flex; gap: 8px; }
.cdots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.cdots button[aria-current="true"] { background: var(--accent); width: 24px; border-radius: 999px; }

/* Requirements: a few figures */
.figs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px 16px; text-align: center; display: grid; gap: 6px; }
.fig b { font-family: var(--display); font-variation-settings: "wdth" 82; font-weight: 750; font-size: clamp(28px, 3.4vw, 40px); line-height: 1; }
.fig span { color: var(--muted); font-size: 14px; }
.center { text-align: center; }
.center a { color: var(--accent); }

/* Free and open: four short lines */
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
/* Info: the guide and the FAQ, two cards leading to their pages */
.infos { display: grid; grid-template-columns: repeat(2, minmax(0, 340px)); gap: 20px; justify-content: center; }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px 24px; text-decoration: none;
  display: grid; justify-items: center; text-align: center; gap: 10px; transition: transform .15s ease, border-color .15s ease; }
.info:hover { transform: translateY(-2px); border-color: var(--accent); }
.info .icon { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.info .icon svg { width: 30px; height: 30px; }
.info b { font-family: var(--display); font-variation-settings: "wdth" 85; font-weight: 750; font-size: 24px; }
.info span { color: var(--muted); font-size: 15.5px; }
.fact { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 12px; }
.fact .icon { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.fact .icon svg { width: 30px; height: 30px; }
.fact b { font-weight: 500; font-size: 17px; }

/* Download + footer, the last screen */
.last { flex-direction: column; justify-content: space-between; padding-bottom: 0; }
.last .box { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface));
  border: 1px solid var(--line); border-radius: 28px; padding: 64px 24px; text-align: center; display: grid; gap: 14px; justify-items: center; margin: auto 0; }
.last .box h2 { font-size: clamp(36px, 5vw, 60px); margin: 0; }
.last .box p { color: var(--muted); margin: 0 0 12px; font-size: 18px; max-width: 28em; }
footer { width: 100%; border-top: 1px solid var(--line); padding: 22px 0 26px; font-size: 13.5px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
footer a { text-decoration: none; } footer a:hover { color: var(--fg); text-decoration: underline; }
footer .marks { flex-basis: 100%; font-size: 12.5px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 160%); visibility: hidden; opacity: 0; background: var(--raised); color: var(--fg);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; font-size: 14px; transition: transform .25s ease, opacity .25s ease, visibility .25s; z-index: 40; max-width: calc(100% - 32px); }
.toast.on { transform: translate(-50%, 0); visibility: visible; opacity: 1; }

/* Demo panel: not part of the site */
.demo { position: fixed; left: 12px; bottom: 12px; z-index: 50; font-size: 13px; color: #C9D1E4; }
.demo > button { background: #05070C; color: #fff; border: 1px solid #2A3348; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.demo .panel { display: none; margin-bottom: 8px; background: #05070C; border: 1px solid #2A3348; border-radius: 12px; padding: 10px 12px; gap: 8px; }
.demo.open .panel { display: grid; }
.demo .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.demo .grp > span { width: 52px; }
.demo .panel button, .demo select { background: #161C2A; border: 1px solid #2A3348; color: #C9D1E4; border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.demo .panel button[aria-pressed="true"] { background: #C9D1E4; color: #05070C; }

@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; gap: 28px; }
  .hero .text { text-align: center; } .hero p.lede { margin-left: auto; margin-right: auto; } .hero .ctas { justify-content: center; }
  .figs { grid-template-columns: repeat(3, 1fr); }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .infos { grid-template-columns: minmax(0, 420px); }
  .dots { display: none; }
}
@media (max-width: 1100px) {   /* below this the header's links no longer fit: the Menu button */
  .menu-btn { display: inline-block; }
  .nav ul { display: none; position: absolute; top: var(--head); left: 0; right: 0; flex-direction: column; gap: 0;
    background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px 16px; }
  .nav ul.open { display: flex; }
  .nav ul a { display: block; padding: 12px; }
  .nav .end .btn { display: none; }
}
@media (max-width: 600px) {
  .wrap { padding: 0 16px; }
  .snap { padding-top: calc(var(--head) + 20px); }
  .slide { padding: 32px 22px; }
  .figs { grid-template-columns: repeat(2, 1fr); }
  .tv .screen { border-width: 6px; }
}
@media (prefers-reduced-motion: reduce) { html, .track { scroll-behavior: auto; } .btn, .toast { transition: none; } }
</style>
</head>
<body>
<header class="site">
  <nav class="wrap nav" aria-label="Main">
    <a class="logo" href="#home" id="logoTop" aria-label="OwneetOS"></a>
    <ul id="menu">
      <li><a href="#features" data-t="nav.features"></a></li>
      <li><a href="#requirements" data-t="nav.requirements"></a></li>
      <li><a href="#open" data-t="nav.open"></a></li>
      <li><a href="#info" data-t="nav.info"></a></li>
      <li><a href="#credits" data-later data-t="foot.credits.short"></a></li>
      <li><a href="#download" data-t="nav.download"></a></li>
    </ul>
    <div class="end">
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="it">IT</button></div>
      <a class="btn primary small" href="#download" data-t="nav.get"></a>
      <button class="menu-btn" type="button" id="menuBtn" aria-expanded="false" aria-controls="menu" data-t="nav.menu"></button>
    </div>
  </nav>
</header>
<nav class="dots" id="dots" aria-label="Sections"></nav>

<main>
  <section class="snap" id="home" data-name="nav.home">
    <div class="wrap hero">
      <div class="text">
        <p class="kicker" data-t="hero.kicker"></p>
        <h1 class="disp" data-t="hero.title"></h1>
        <p class="lede" data-t="hero.lede"></p>
        <div class="ctas"><a class="btn primary" href="#download" data-t="hero.download"></a><a class="btn ghost" href="#features" data-t="hero.features"></a></div>
      </div>
      <div class="tv" aria-hidden="true">
        <div class="screen">
          <div class="top">
            <span id="logoTv"></span>
            <div class="tabs"><span class="pill">LB</span><b data-t="tv.home"></b><i data-t="tv.library"></i><i data-t="tv.settings"></i><span class="pill">RB</span></div>
            <div class="status"><span data-icon="padsmall"></span><span>78%</span><span data-icon="wifi"></span><span>21:40</span></div>
          </div>
          <div class="main">
            <div class="card">
              <span class="k" data-t="tv.continue"></span><span class="t">Star Drift</span>
              <span class="meta"><span>Steam</span><span data-t="tv.yesterday"></span><span>12 h 40 min</span></span>
              <span class="acts"><span data-t="tv.play"></span><span data-t="tv.details"></span></span>
            </div>
            <div class="side"><span class="label" data-t="tv.apps"></span><div class="apps" id="tvApps"></div></div>
          </div>
          <div><div class="rowhead"><b data-t="tv.jump"></b><span data-t="tv.together"></span></div><div class="row" id="tvRow"></div></div>
          <div class="prompts"><span><span><i>A</i><span data-t="tv.select"></span></span><span><i>X</i><span data-t="tv.options"></span></span></span>
            <span><span><i>B</i><span data-t="tv.menu"></span></span></span></div>
        </div>
        <div class="stand"></div>
      </div>
    </div>
  </section>

  <section class="snap" id="features" data-name="nav.features">
    <div class="wrap">
      <div class="head"><h2 class="disp" data-t="feat.title"></h2><p data-t="feat.lede"></p></div>
      <div class="carousel" id="carousel" role="region" aria-roledescription="carousel">
        <div class="track" id="track" tabindex="0"></div>
        <div class="cnav">
          <button class="arrow" type="button" id="prev" data-icon="left"></button>
          <div class="cdots" id="cdots"></div>
          <button class="arrow" type="button" id="next" data-icon="right"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="snap" id="requirements" data-name="nav.requirements">
    <div class="wrap">
      <div class="head"><h2 class="disp" data-t="req.title"></h2><p data-t="req.lede"></p></div>
      <div class="figs">
        <div class="fig"><b>64-bit</b><span data-t="req.cpu"></span></div>
        <div class="fig"><b>UEFI</b><span data-t="req.fw"></span></div>
        <div class="fig"><b>4 GB</b><span data-t="req.ram"></span></div>
        <div class="fig"><b>32 GB</b><span data-t="req.disk"></span></div>
        <div class="fig"><b>Vulkan</b><span data-t="req.gpu"></span></div>
      </div>
      <p class="center muted" data-t="req.more"></p>
    </div>
  </section>

  <section class="snap" id="open" data-name="nav.open">
    <div class="wrap">
      <div class="head"><h2 class="disp" data-t="open.title"></h2><p data-t="open.lede"></p></div>
      <div class="facts">

  update: `<svg viewBox="0 0 24 24" ${S}><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>`,
  palette: `<svg viewBox="0 0 24 24" ${S}><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.6-1-2.6 0-.9.7-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r=".9" fill="currentColor"/><circle cx="10" cy="7" r=".9" fill="currentColor"/><circle cx="15" cy="7.5" r=".9" fill="currentColor"/></svg>`,
  code: `<svg viewBox="0 0 24 24" ${S}><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" ${S}><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>`,
  offline: `<svg viewBox="0 0 24 24" ${S}><path d="M2 9a15 15 0 0 1 6-3.4M22 9a15 15 0 0 0-9-4M5 12.5a10 10 0 0 1 4-2.2M19 12.5a10 10 0 0 0-3-1.9M8.5 16a5 5 0 0 1 7 0"/><path d="M3 3l18 18"/></svg>`,
  book: `<svg viewBox="0 0 24 24" ${S}><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 8h8M8 11.5h6"/></svg>`,
  question: `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.2" r=".7" fill="currentColor"/></svg>`,
  people: `<svg viewBox="0 0 24 24" ${S}><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2A5 5 0 0 1 21 19"/></svg>`,
  left: `<svg viewBox="0 0 24 24" ${S}><path d="M15 5l-7 7 7 7"/></svg>`,
  right: `<svg viewBox="0 0 24 24" ${S}><path d="M9 5l7 7-7 7"/></svg>`,};

// ---- Palettes (the console's design tokens): bg, surface, raised, line, fg, muted, accent, on-accent
const PALETTES = [
  ['dusk', 'Dusk', 'dark', '#0E1424', '#172036', '#222D4A', '#2E3A5C', '#EEF1F8', '#8F9AB5', '#FF8A5B', '#1E0E06'],
  ['tide', 'Tide', 'dark', '#031A1C', '#06292D', '#0A3A3F', '#0F5157', '#E4FFFC', '#7ED9D0', '#2EF2DA', '#00231F'],
  ['bloom', 'Bloom', 'dark', '#1A1020', '#25182D', '#33223D', '#45304F', '#F7EEF6', '#AE93AE', '#FF7AA8', '#2A0614'],
  ['ember', 'Ember', 'dark', '#1C0F0C', '#2A1713', '#3A201A', '#4E2C24', '#FBEDE9', '#C49C93', '#FF6B47', '#2A0A03'],
  ['lagoon', 'Lagoon', 'dark', '#0A1426', '#101E38', '#182A4B', '#23395F', '#EAF1FF', '#90A4C9', '#4DA3FF', '#03162E'],
  ['amethyst', 'Amethyst', 'dark', '#15121F', '#1F1A2E', '#2A2340', '#3A3155', '#F1EDFA', '#A99FC4', '#B69CFF', '#1B0E3A'],
  ['graphite', 'Graphite', 'dark', '#121212', '#1C1C1C', '#262626', '#383838', '#F2F2F2', '#A6A6A6', '#DADADA', '#121212'],
  ['daylight', 'Daylight', 'light', '#EEF0F5', '#FFFFFF', '#E2E6EF', '#C9CFDC', '#121826', '#5A6378', '#2F5BEA', '#FFFFFF'],
  ['sand', 'Sand', 'light', '#F4EEE3', '#FFFBF4', '#E8DFD0', '#D3C6B1', '#2A2117', '#6A5C49', '#B04A28', '#FFFFFF'],
  ['sakura', 'Sakura', 'light', '#FBEFF3', '#FFFFFF', '#F3DDE5', '#E3C3CF', '#2A1420', '#76505F', '#C92A62', '#FFFFFF'],
];
const TOKENS = ['bg', 'surface', 'raised', 'line', 'fg', 'muted', 'accent', 'on-accent'];
// "Auto" follows the visitor's light / dark preference: Dusk when dark, Daylight when light
const state = { lang: 'en', pal: 'auto', logo: 'draft', slide: 0 };

// ---- The logo: the 7.6 draft (the gamepad "O") or the current wordmark; colours from CSS
function markData() {
  const k = 1.2, c = 50, rc = 16;
  const T2 = (x, y) => [c + (x - c) * k, c + (y - c) * k];
  const P = (x, y) => T2(x, y).map(v => v.toFixed(2)).join(',');
  const a = r => (r * k).toFixed(2);
  const circle = (x, y, r) => { const [u, v] = T2(x, y), R = r * k;
    return `M${(u - R).toFixed(2)},${v.toFixed(2)}a${a(r)},${a(r)} 0 1,0 ${(2 * R).toFixed(2)},0` +
      `a${a(r)},${a(r)} 0 1,0 ${(-2 * R).toFixed(2)},0Z`; };
  const top = 33.5, r = 16, cy = 49.5, d = r * Math.SQRT1_2;
  const lb = [32 + d, cy + d], rb = [68 - d, cy + d];
  const body = `M${P(16 + rc, top)}L${P(84 - rc, top)}A${a(rc)},${a(rc)} 0 0,1 ${P(84, top + rc)}L${P(84, cy)}` +
    `A${a(r)},${a(r)} 0 0,1 ${P(...rb)}Q${P(50, 54.5)} ${P(...lb)}A${a(r)},${a(r)} 0 0,1 ${P(16, cy)}` +
    `L${P(16, top + rc)}A${a(rc)},${a(rc)} 0 0,1 ${P(16 + rc, top)}Z`;
  const dx = 32, dy = 48.5, w = 2.6, l = 7.4;
  const cross = 'M' + [[dx - w, dy - l], [dx + w, dy - l], [dx + w, dy - w], [dx + l, dy - w], [dx + l, dy + w], [dx + w, dy + w],
    [dx + w, dy + l], [dx - w, dy + l], [dx - w, dy + w], [dx - l, dy + w], [dx - l, dy - w], [dx - w, dy - w]]
    .map(([x, y]) => P(x, y)).join('L') + 'Z';
  const fx = 68, fy = 48.5, o = 5.8, br = 2.7;
  const face = [[fx, fy - o], [fx + o, fy], [fx, fy + o], [fx - o, fy]].map(([x, y]) => circle(x, y, br)).join('');
  return 'M0,50a50,50 0 1,0 100,0a50,50 0 1,0 -100,0Z' + body + cross + face;
}
const MARK = markData();
const O_X = 19.6, O_CY = -330, O_D = 684 * 1.25, GAP = 30, SHIFT = O_X + O_D - 457.5 + GAP;
const VB_TOP = Math.min(-752.3, O_CY - O_D / 2 - 60), VB_BOTTOM = Math.max(92.2, O_CY + O_D / 2 + 60);
function logo() {
  const old = state.logo === 'current';
  const w = 3521.8 + (old ? 0 : SHIFT), top = old ? -752.3 : VB_TOP, h = (old ? 92.2 : VB_BOTTOM) - top;
  const o = old ? `<path class="wm-text" d="${OLD_O}"/>`
    : `<g transform="translate(${O_X} ${O_CY - O_D / 2}) scale(${O_D / 100})"><path class="wm-accent" fill-rule="evenodd" d="${MARK}"/></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60.4 ${top.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="OwneetOS">${o}` +
    `<g transform="translate(${old ? 0 : SHIFT} 0)">${WNEET.map(d => `<path class="wm-text" d="${d}"/>`).join('')}` +
    `${OS.map(d => `<path class="wm-accent" d="${d}"/>`).join('')}</g></svg>`;
}

// ---- Rendering
const $ = s => document.querySelector(s);
const tr = k => T[state.lang][k];
const dark = matchMedia('(prefers-color-scheme: dark)');
const SECTIONS = [...document.querySelectorAll('main > section')];
let current = SECTIONS[0].id;

function render() {
  const name = state.pal === 'auto' ? (dark.matches ? 'dusk' : 'daylight') : state.pal;
  const p = PALETTES.find(q => q[0] === name);
  TOKENS.forEach((t, i) => document.documentElement.style.setProperty('--' + t, p[i + 3]));
  document.documentElement.style.colorScheme = p[2];
  document.documentElement.lang = state.lang;
  const slideName = i => tr('slide').replace('%n', i + 1).replace('%t', SLIDES.length);
  $('#tvApps').innerHTML = APPS.map(([ic, t]) => `<div class="app"><span class="ico" data-icon="${ic}"></span><span data-t="${t}"></span></div>`).join('');
  $('#tvRow').innerHTML = GAMES.map(([n, h]) => `<div class="cover" style="--h:${h}">${n}</div>`).join('');
  // the strip: a copy of the last card before the first and of the first after the last (the loop)
  const card = ([ic, t], i, copy) => `<div class="slide${copy ? ' copy' : ''}" ${copy ? 'aria-hidden="true"' : `role="group" aria-roledescription="slide" aria-label="${slideName(i)}"`}>` +
    `<div class="icon" data-icon="${ic}"></div><h3 data-t="${t}.t"></h3><p data-t="${t}.p"></p></div>`;
  $('#track').innerHTML = card(SLIDES[SLIDES.length - 1], SLIDES.length - 1, true) + SLIDES.map((sl, i) => card(sl, i)).join('') + card(SLIDES[0], 0, true);
  $('#cdots').innerHTML = SLIDES.map((_, i) => `<button type="button" data-go="${i}" aria-label="${slideName(i)}"></button>`).join('');
  $('#dots').innerHTML = SECTIONS.map(s => `<a href="#${s.id}" aria-label="${tr(s.dataset.name)}" title="${tr(s.dataset.name)}"></a>`).join('');
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = tr(el.dataset.t); });
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon]; });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
  for (const id of ['logoTop', 'logoTv', 'logoFoot']) $('#' + id).innerHTML = logo();
  $('#logoFoot svg').style.height = '22px';
  $('#prev').setAttribute('aria-label', tr('prev')); $('#next').setAttribute('aria-label', tr('next'));
  $('#themeGrp').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.pal));
  $('#logoGrp').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.logo));
  $('#pal').value = PALETTES.some(q => q[0] === state.pal) ? state.pal : '';
  document.querySelectorAll('[data-later]').forEach(a => a.onclick = e => { e.preventDefault(); toast(tr('later')); });
  showSlide(state.slide, false);
  restart();
  markSection(current);
}

// ---- The carousel: arrows, dots, swipe (horizontal snapping), left / right when it has focus.
// It loops: the strip holds a copy of the last card before the first and of the first after the
// last; once it stops on a copy, it jumps (instantly, unseen) to the card it copies.
// It plays by itself every AUTOPLAY ms, paused only while the pointer is on it or it has focus
// from the keyboard, and while the section or the page is not on screen.
const AUTOPLAY = 5000;
const cards = () => document.querySelectorAll('#track .slide');      // copy, 0 .. n-1, copy
const place = pos => { const c = cards()[pos], t = $('#track'); return c.offsetLeft - (t.clientWidth - c.clientWidth) / 2; };
function jump(pos) {
  const t = $('#track');
  t.style.scrollBehavior = 'auto'; t.style.scrollSnapType = 'none';
  t.scrollLeft = place(pos);
  t.offsetWidth;   // apply the jump before the smooth scrolling and the snapping come back
  t.style.scrollBehavior = ''; t.style.scrollSnapType = '';
}
function mark() {
  cards().forEach((c, pos) => c.setAttribute('aria-current', pos === state.slide + 1));
  document.querySelectorAll('#cdots button').forEach((b, n) => b.setAttribute('aria-current', n === state.slide));
}
// i may be -1 (the copy of the last card, before the first) or n (the copy of the first, after the last)
function showSlide(i, scroll = true) {
  const n = SLIDES.length;
  state.slide = (i + n) % n;
  mark();
  if (!scroll) { jump(state.slide + 1); return; }
  $('#track').scrollTo({ left: place(i + 1) });
  // onto a copy: once the slide has ended, move to the card it copies (also without scroll events)
  if (i < 0 || i >= n) setTimeout(settle, 900);
}
const step = d => { showSlide(state.slide + d); restart(); };
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#cdots').onclick = e => { const b = e.target.closest('[data-go]'); if (b) { showSlide(+b.dataset.go); restart(); } };
$('#track').addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
});
// when the strip stops (after a slide or a swipe): the card nearest the middle is the current one;
// on a copy, jump to the card it copies
function settle() {
  const t = $('#track'), mid = t.scrollLeft + t.clientWidth / 2, n = SLIDES.length;
  let best = 0, dist = Infinity;
  cards().forEach((c, pos) => { const d = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid); if (d < dist) { dist = d; best = pos; } });
  if (dist > 4) return;   // still moving
  if (best === 0) { state.slide = n - 1; jump(n); }
  else if (best === n + 1) { state.slide = 0; jump(1); }
  else state.slide = best - 1;
  mark();
}
let settleTimer;
$('#track').addEventListener('scroll', () => { clearTimeout(settleTimer); settleTimer = setTimeout(settle, 120); });
$('#track').addEventListener('scrollend', settle);

// autoplay
let timer = null, hovered = false, inView = false;
const running = () => !hovered && inView && !document.hidden;
function restart() {
  clearInterval(timer); timer = null;
  if (running()) timer = setInterval(() => showSlide(state.slide + 1), AUTOPLAY);
}
$('#carousel').addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hovered = true; restart(); } });
$('#carousel').addEventListener('pointerleave', () => { hovered = false; restart(); });
// focus pauses it only when it comes from the keyboard (a click gives the button focus too)
$('#carousel').addEventListener('focusin', e => { if (e.target.matches(':focus-visible')) { hovered = true; restart(); } });
$('#carousel').addEventListener('focusout', e => { if (!$('#carousel').contains(e.relatedTarget)) { hovered = false; restart(); } });
document.addEventListener('visibilitychange', restart);
new IntersectionObserver(([e]) => { inView = e.isIntersecting; restart(); }, { threshold: 0.5 }).observe($('#carousel'));

// ---- Sections: the address, the menu and the dots follow the section on screen
function markSection(id) {
  current = id;
  document.querySelectorAll('#dots a, #menu a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + id));
}
const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    markSection(e.target.id);
    const extra = (location.hash.match(/&.*/) || [''])[0];
    if (location.hash.split('&')[0] !== '#' + e.target.id) history.replaceState(null, '', '#' + e.target.id + extra);
  }
}, { threshold: 0.55 });
SECTIONS.forEach(s => io.observe(s));

let toastTimer;
function toast(text) {
  $('#toast').textContent = text; $('#toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 2600);
}

// ---- Demo panel
$('#demoBtn').onclick = () => $('#demo').classList.toggle('open');
$('#pal').innerHTML = '<option value="">—</option>' + PALETTES.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('');
$('#pal').onchange = e => { state.pal = e.target.value || 'auto'; render(); };
[['auto', 'Auto'], ['dusk', 'Dark'], ['daylight', 'Light']].forEach(([v, name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = name; b.dataset.v = v;
  b.onclick = () => { state.pal = v; render(); }; $('#themeGrp').append(b); });
[['draft', 'Gamepad O (7.6 draft)'], ['current', 'Current']].forEach(([v, name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = name; b.dataset.v = v;
  b.onclick = () => { state.logo = v; render(); }; $('#logoGrp').append(b); });
dark.addEventListener('change', () => state.pal === 'auto' && render());

// ---- Site
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { state.lang = b.dataset.lang; render(); });
$('#dlBtn').onclick = e => { e.preventDefault(); toast(tr('soon')); };
$('#menuBtn').onclick = () => { const open = $('#menu').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', open); };
$('#menu').addEventListener('click', e => { if (e.target.closest('a')) { $('#menu').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', false); } });
// start state in the address, e.g. #features&lang=it&pal=dusk&logo=current
const browserLang = (navigator.language || 'en').slice(0, 2);
state.lang = T[browserLang] ? browserLang : 'en';
const opt = name => (new RegExp(name + '=([\\w-]+)').exec(location.hash) || [])[1];
if (T[opt('lang')]) state.lang = opt('lang');
if (PALETTES.some(q => q[0] === opt('pal'))) state.pal = opt('pal');
if (['draft', 'current'].includes(opt('logo'))) state.logo = opt('logo');
// "&only=features" shows that section alone (to take a screenshot of it)
if (opt('only')) SECTIONS.forEach(sec => { if (sec.id !== opt('only')) sec.style.display = 'none'; });
render();
const startAt = location.hash.split('&')[0].slice(1);
if (startAt && document.getElementById(startAt)) document.getElementById(startAt).scrollIntoView({ behavior: 'instant' });
</script>
</body>
