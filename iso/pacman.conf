#
# pacman configuration used to build the ISO (not the one shipped inside it).
#
# Packages come from an Arch Linux Archive snapshot, so every build of the same commit gets the
# same package versions. Move the date forward only after testing (PROJECT_RULES.md section 5),
# and record the new date in iso/README.md.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
# The Arch Linux Archive is sometimes slow: wait instead of failing the build.
DisableDownloadTimeout
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Keep OwneetOS's own /etc/os-release instead of Arch's symlink (see airootfs/etc/os-release).
NoExtract   = etc/os-release

[core]
Server = https://archive.archlinux.org/repos/2026/10/03/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/03/$repo/os/$arch
