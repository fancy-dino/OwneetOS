# OwneetOS: a program's sound starts as the program asks, never as it was left. By default
# WirePlumber remembers each program's volume and mute and gives them back at its next start. The
# console mutes a game or an emulator behind the home screen (owneetd), and a game is mostly
# closed from there: its program was remembered as muted, and its next start had no sound (owner's
# test, 2026-11-27, five emulators; owneetd only gives back what it muted itself). The console has no
# volume per program, so nothing is lost; the chosen output is still remembered
# (node.stream.restore-target).
wireplumber.settings = {
  node.stream.restore-props = false
}
