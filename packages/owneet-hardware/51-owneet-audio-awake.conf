# OwneetOS: sound outputs never go to sleep. By default an idle output is suspended after a few
# seconds, and waking it cuts or delays the start of the next short sound (the interface's clicks,
# [[step-3.12-interface-sounds]]). A console keeps its sound ready, as a TV does.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
