#
# What the console needs from the emulation program (RetroArch, [[optional-apps]]), added to the
# user's settings at every start by owneet-emulation-run. Everything else is the user's.

# Full screen, as every game of the console
video_fullscreen = "true"

# The controllers through SDL: their standard layout for every controller SDL knows. RetroArch's own
# profile for them binds no Guide: Guide stays the console's ([[guide-button]])
input_joypad_driver = "sdl2"

# Its menu opens on a short Guide press: owneetd writes "MENU_TOGGLE" to the program's input
stdin_cmd_enable = "true"

# No combination of buttons opens its menu or quits: a button never has two meanings on the same
# screen ([[controller-input-map]])
input_menu_toggle_gamepad_combo = "0"
input_quit_gamepad_combo = "0"
