# The dumps of programs that crash take at most 100 MB (6.11, owner 2026-11-13: the console cleans its
# own leftovers; 2026-11-11: a game's launcher crashing often left 23-27 MB each time). The crash
# stays in the journal; systemd also removes old dumps by itself.
[Coredump]
MaxUse=100M
