# "Shutting down" under the spinner. The logo stays for a moment at power-off: a screen may take
# seconds to show it after the session, and a PC that powers off sooner leaves it black (owner's test
# on FrankenPC, 2026-11-05).
[Service]
ExecStartPost=-/usr/lib/owneet/owneet-splash-message splash.shutting_down
ExecStartPost=-/usr/bin/sleep 3
