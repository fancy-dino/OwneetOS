# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run project checks (shellcheck, SPDX headers, markdownlint)
        run: tools/lint

  iso:
    name: ISO
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ISO
        run: |
          # Placeholder until roadmap step 1.6. ISOs are built in the builder VM: tools/build-in-vm tools/build-iso
          test -f iso/profiledef.sh
          echo "::notice::The ISO is not built in CI yet (roadmap step 1.6)."

